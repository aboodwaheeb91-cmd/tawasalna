<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Unified app header with back (HEADER-NAV.md) -->
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<meta name="tw-page" content="auth">
<style>
/* Settings — page styles (DS-COLOR --color-* tokens only — sizes stay raw until DS-SIZE phase 2 approval) */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-body);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
}
.skip-link {
  position: absolute; top: -40px; right: 0;
  background: var(--color-brand-primary); color: var(--color-text-on-brand);
  padding: 8px 16px; border-radius: 0 0 10px 0;
  font-size: .78rem; font-weight: 700; text-decoration: none; transition: top .2s; z-index: 10000;
}
.skip-link:focus { top: 0; }

.st-main { max-width: 600px; margin: 0 auto; padding: 20px 16px 48px; }
.st-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 900; margin-bottom: 6px; }
.st-title svg { color: var(--color-brand-primary); }
.st-sub { font-size: .72rem; color: var(--color-text-muted); margin-bottom: 32px; }

/* ── Section ── */
.st-sec { margin-bottom: 24px; }
.st-sec-title { font-size: .65rem; font-weight: 800; color: var(--color-text-muted); letter-spacing: 1px; margin-bottom: 8px; padding-inline-start: 4px; }
.st-card { background: var(--color-surface-card); border: 1px solid var(--color-border-subtle); border-radius: 16px; overflow: hidden; }

/* ── Row (a <button> when it opens something) ── */
.st-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px 16px; border: none; border-bottom: 1px solid var(--color-border-subtle);
  background: transparent; color: inherit; font-family: inherit; text-align: start;
}
.st-row:last-child { border-bottom: none; }
button.st-row { cursor: pointer; transition: background-color .15s; }
button.st-row:hover { background: var(--color-surface-hover); }
button.st-row:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
.st-row.is-locked { opacity: .6; }
.st-ico {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--color-surface-input); color: var(--color-text-secondary);
}
.st-ico.is-brand  { background: rgba(var(--color-brand-primary-rgb), .12); color: var(--color-brand-primary); }
.st-ico.is-danger { background: rgba(var(--color-status-danger-rgb), .12); color: var(--color-status-danger); }
.st-body { flex: 1; min-width: 0; }
.st-name { font-size: .82rem; font-weight: 700; margin-bottom: 2px; }
.st-val  { font-size: .72rem; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-end  { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: var(--color-text-muted); }
.st-tag  { font-size: .6rem; color: var(--color-text-muted); background: var(--color-surface-input); border-radius: 8px; padding: 2px 6px; }
.st-danger { border-color: rgba(var(--color-status-danger-rgb), .2); }
.st-danger .st-name { color: var(--color-status-danger); }

/* ── KYC status pill ── */
.st-kyc-state { font-size: .65rem; font-weight: 700; }
.st-kyc-state.is-approved { color: var(--color-status-success); }
.st-kyc-state.is-review   { color: var(--color-status-warning); }
.st-kyc-state.is-rejected { color: var(--color-status-danger); }

/* ── Forms inside twModal (DS-OVL) ── */
.st-form { display: flex; flex-direction: column; gap: 12px; }
.st-field label { display: block; font-size: .72rem; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 4px; }
.st-field .tw-input[dir="ltr"] { text-align: left; }
.st-field.has-error .tw-input { border-color: var(--color-status-danger); }
.st-err { display: none; font-size: .65rem; font-weight: 700; color: var(--color-status-danger); margin-top: 4px; }
.st-field.has-error .st-err { display: block; }

/* ── KYC steps ── */
.st-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
.st-dot {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: .65rem;
  border: 2px solid var(--color-border-strong); color: var(--color-text-muted);
}
.st-dot.is-active { border-color: var(--color-brand-primary); color: var(--color-brand-primary); }
.st-dot.is-done   { border-color: var(--color-brand-primary); background: var(--color-brand-primary); color: var(--color-text-on-brand); }
.st-line { flex: 1; height: 2px; background: var(--color-border-subtle); }
.st-hint { font-size: .72rem; color: var(--color-text-muted); line-height: 1.7; }
.st-code { text-align: center; letter-spacing: 6px; font-size: .95rem; }
.st-file {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 16px;
  border: 2px dashed var(--color-border-strong); border-radius: 14px;
  background: transparent; color: var(--color-text-secondary); font-family: inherit; font-size: .78rem; cursor: pointer; text-align: start;
}
.st-file.is-picked { border-style: solid; border-color: var(--color-brand-primary); color: var(--color-text-primary); }
.st-result { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 12px 0; }
.st-result svg { width: 40px; height: 40px; }
.st-result.is-approved svg { color: var(--color-status-success); }
.st-result.is-review svg   { color: var(--color-status-warning); }
.st-result.is-rejected svg { color: var(--color-status-danger); }
.st-result-title { font-size: .9rem; font-weight: 800; color: var(--color-text-primary); }
</style>
</head>
<body>
<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<!-- Unified app header with back; fallback = own account page when there is no in-site history (HNAV-03) -->
<header data-tw-header data-back="account"></header>

<main class="st-main" id="main-content">
  <h1 class="st-title"><i data-tw-icon="settings"></i><span data-tw-t="settings.title"></span></h1>
  <p class="st-sub" data-tw-t="settings.subtitle"></p>

  <!-- ── معلومات التواصل ── -->
  <section class="st-sec">
    <h2 class="st-sec-title" data-tw-t="settings.sec.contact"></h2>
    <div class="st-card">
      <!-- Email change (task 5.1b) — link to the new address; changes only after it is opened -->
      <button type="button" class="st-row" data-st-open="email">
        <span class="st-ico"><i data-tw-icon="mail"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.email"></span>
          <span class="st-val" id="dispEmail">—</span>
        </span>
        <span class="st-end"><i data-tw-icon="next" data-tw-size="xs"></i></span>
      </button>
      <button type="button" class="st-row" data-st-open="phone">
        <span class="st-ico"><i data-tw-icon="phone"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.phone"></span>
          <span class="st-val" id="dispPhone"></span>
        </span>
        <span class="st-end"><i data-tw-icon="next" data-tw-size="xs"></i></span>
      </button>
    </div>
  </section>

  <!-- ── الأمان ── -->
  <section class="st-sec">
    <h2 class="st-sec-title" data-tw-t="settings.sec.security"></h2>
    <div class="st-card">
      <button type="button" class="st-row" data-st-open="password">
        <span class="st-ico"><i data-tw-icon="lock"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.password"></span>
          <span class="st-val" data-tw-t="settings.password_hint"></span>
        </span>
        <span class="st-end"><i data-tw-icon="next" data-tw-size="xs"></i></span>
      </button>
      <!-- KYC (SYSTEMS_INDEX §23) — the entry point of the identity-verification flow. Hidden until
           settings.js confirms the verify_identity action is on (off by default until plan 5.1) —
           when off the row is removed: no button, no text, no /kyc request. -->
      <div class="st-row" id="kycRow" hidden>
        <span class="st-ico is-brand"><i data-tw-icon="shield-check"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.kyc.title"></span>
          <span class="st-val st-kyc-state" id="kycState"></span>
        </span>
        <span class="st-end" id="kycAction"></span>
      </div>
    </div>
  </section>

  <!-- ── معلومات الحساب ── -->
  <section class="st-sec">
    <h2 class="st-sec-title" data-tw-t="settings.sec.account"></h2>
    <div class="st-card">
      <div class="st-row is-locked">
        <span class="st-ico"><i data-tw-icon="user"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.full_name"></span>
          <span class="st-val" id="dispName">—</span>
        </span>
        <span class="st-end"><span class="st-tag" data-tw-t="settings.from_profile"></span></span>
      </div>
      <div class="st-row is-locked">
        <span class="st-ico"><i data-tw-icon="tag"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.account_type"></span>
          <span class="st-val" id="dispType">—</span>
        </span>
        <span class="st-end"><i data-tw-icon="lock" data-tw-size="xs"></i></span>
      </div>
      <div class="st-row is-locked">
        <span class="st-ico"><i data-tw-icon="id-card"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.account_id"></span>
          <span class="st-val" id="dispID">—</span>
        </span>
        <span class="st-end"><i data-tw-icon="lock" data-tw-size="xs"></i></span>
      </div>
    </div>
  </section>

  <!-- ── منطقة الخطر — account delete hidden until soft delete (plan 5.5 · F27) ── -->
  <section class="st-sec">
    <h2 class="st-sec-title" data-tw-t="settings.sec.danger"></h2>
    <div class="st-card st-danger">
      <div class="st-row is-locked">
        <span class="st-ico is-danger"><i data-tw-icon="delete"></i></span>
        <span class="st-body">
          <span class="st-name" data-tw-t="settings.delete"></span>
          <span class="st-val" data-tw-t="settings.delete_soon"></span>
        </span>
      </div>
    </div>
  </section>
</main>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-upload.js"></script>
<script src="/static/settings/settings.js"></script>
</body>
</html>
