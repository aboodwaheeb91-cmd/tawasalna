<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Unified app header + bottom nav (HEADER-NAV.md) -->
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<style>
/* Edu profile — «قريباً» state until plan 5.2 (DS-COLOR --color-* tokens only — sizes stay raw until DS-SIZE phase 2 approval) */
:root {
  --ep-accent:     var(--color-categorical-purple);
  --ep-accent-rgb: var(--color-categorical-purple-rgb);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-body);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
}
.skip-link {
  position: absolute; top: -40px; right: 0;
  background: var(--ep-accent); color: var(--color-text-on-fill);
  padding: 8px 16px; border-radius: 0 0 10px 0;
  font-size: .78rem; font-weight: 700; text-decoration: none; transition: top .2s; z-index: 10000;
}
.skip-link:focus { top: 0; }

/* ── Hero (decorative) ── */
.ep-hero {
  height: 170px;
  background: linear-gradient(135deg, rgba(var(--ep-accent-rgb), .18), rgba(var(--color-brand-secondary-rgb), .1));
}

/* ── Profile card ── */
.ep-head { max-width: 900px; margin: -50px auto 0; padding: 0 16px; position: relative; }
.ep-card {
  display: flex; gap: 18px; align-items: flex-start;
  background: var(--color-surface-card-solid); border: 1px solid var(--color-border-subtle);
  border-radius: 20px; padding: 24px;
}
.ep-logo {
  width: 86px; height: 86px; flex-shrink: 0; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(var(--ep-accent-rgb), .14); color: var(--ep-accent);
  border: 2px solid rgba(var(--ep-accent-rgb), .3);
}
.ep-logo svg { width: 40px; height: 40px; }
.ep-info { flex: 1; min-width: 0; }
.ep-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ep-name { font-size: 1.2rem; font-weight: 900; margin-bottom: 4px; }
.ep-badge {
  display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px;
  padding: 2px 10px; border-radius: 999px; font-size: .65rem; font-weight: 800;
  background: rgba(var(--ep-accent-rgb), .12); color: var(--ep-accent); border: 1px solid rgba(var(--ep-accent-rgb), .25);
}
.ep-desc { font-size: .78rem; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 10px; }
.ep-meta { display: flex; gap: 12px; flex-wrap: wrap; }
.ep-meta-item { display: flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--color-text-muted); }
.ep-meta-item a { color: var(--ep-accent); text-decoration: none; }
.ep-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

/* ── «قريباً» card ── */
.ep-content { max-width: 900px; margin: 16px auto 0; padding: 0 16px 40px; }
.ep-soon {
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 48px 20px;
  background: var(--color-surface-card); border: 1px solid var(--color-border-subtle); border-radius: 16px;
}
.ep-soon-ico { color: var(--ep-accent); }
.ep-soon-ico svg { width: 40px; height: 40px; }
.ep-soon-title { font-size: .95rem; font-weight: 800; color: var(--color-text-primary); }
.ep-soon-sub { font-size: .78rem; color: var(--color-text-muted); line-height: 1.7; max-width: 420px; }

/* ── Edit form (inside twModal — DS-OVL) ── */
.ep-form { display: flex; flex-direction: column; gap: 12px; }
.ep-field label { display: block; font-size: .72rem; font-weight: 700; color: var(--color-text-secondary); margin-bottom: 4px; }
.ep-field textarea.tw-input { resize: vertical; min-height: 72px; }

@media (max-width: 700px) {
  .ep-card { flex-direction: column; align-items: center; text-align: center; }
  .ep-top, .ep-meta, .ep-actions { justify-content: center; }
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<!-- ══ UNIFIED APP HEADER (HEADER-NAV.md — rendered by twMountAppChrome) ══ -->
<header data-tw-header></header>

<div class="ep-hero" aria-hidden="true"></div>

<!-- ══ PROFILE CARD — only API-backed fields (name · avatar · bio · location · website) — PR 1.7 ══ -->
<div class="ep-head">
  <div class="ep-card">
    <div class="ep-logo" id="profileLogo"><i data-tw-icon="graduation-cap"></i></div>
    <div class="ep-info">
      <div class="ep-top">
        <div>
          <h1 class="ep-name" id="profileName"></h1>
          <div class="ep-badge"><i data-tw-icon="graduation-cap" data-tw-size="xs"></i><span data-tw-t="account.type.edu"></span></div>
          <p class="ep-desc" id="profileDesc"></p>
          <div class="ep-meta">
            <span class="ep-meta-item"><i data-tw-icon="map-pin" data-tw-size="xs"></i><span id="profileLoc">—</span></span>
            <span class="ep-meta-item"><i data-tw-icon="globe" data-tw-size="xs"></i><a id="aboutWeb">—</a></span>
          </div>
        </div>
        <!-- Owner / visitor actions (VM-01) — buttons from twAction (BTN-19) -->
        <div class="ep-actions" id="ownerActions" style="display:none"></div>
        <div class="ep-actions" id="visitorActions"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ CONTENT — courses / ratings / students / posts rebuilt in plan 5.2 (docs/FUTURE_ROADMAP.md) ══ -->
<main class="ep-content" id="main-content">
  <div class="ep-soon" id="eduSoon">
    <span class="ep-soon-ico"><i data-tw-icon="graduation-cap"></i></span>
    <h2 class="ep-soon-title" data-tw-t="edu.soon.title"></h2>
    <p class="ep-soon-sub" data-tw-t="edu.soon.sub"></p>
  </div>
</main>

<!-- ══ UNIFIED BOTTOM NAV (HNAV-06) ══ -->
<nav data-tw-bottom-nav></nav>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script>
let _isOwner=false;
let _data={name:'',desc:'',loc:'',web:'',avatar:'',twId:''};
let _editDlg=null;

document.title = twT('page.title', { page: twT('edu.title') });
twTApply(document.body);
twIcon.hydrate(document.body);

// Resolve profile id: 1) injected by Smart Router (/u/T…), 2) ?id= query param
var _urlId = (window._eduProfileIdFromRoute != null)
  ? String(window._eduProfileIdFromRoute)
  : new URLSearchParams(window.location.search).get('id');
if (window._eduTwIdFromRoute) _data.twId = String(window._eduTwIdFromRoute);

// ── VM-01-BFCACHE: live owner guard ──
// Ownership comes ONLY from the TwAuthSync snapshot (PR 1.7 — never the localStorage user cache).
// Must be called before every owner mutation (openEditModal, saveEdit).
// See: docs/design-system/VIEWER-MODES.md §VM-01-BFCACHE
function _isCurrentEduOwner() {
  // Fail-closed: without TwAuthSync ownership cannot be confirmed.
  if (!window.TwAuthSync || !TwAuthSync.getSessionSnapshot) return false;
  var _snap = TwAuthSync.getSessionSnapshot();
  if (!_snap || !_snap.isAuthenticated || _snap.userType !== 'edu') return false;
  if (_snap.userId == null) return false;
  return !_urlId || String(_snap.userId) === String(_urlId);
}

var _eduMsgSeq = 0;
// Owner «تعديل الملف» / visitor «مراسلة» — visibility + guest → login are twAction's (BTN-19)
function _renderEduActions() {
  var ownerEl   = document.getElementById('ownerActions');
  var visitorEl = document.getElementById('visitorActions');
  ownerEl.textContent = '';
  visitorEl.textContent = '';
  if (_isOwner) {
    var edit = twAction('edit_profile', { mode: 'owner', onClick: openEditModal });
    if (edit) ownerEl.appendChild(edit);
  } else if (_data.twId) {
    // «مراسلة» only when the server rule allows it (twCanMessage — task 5.0g)
    var seq = ++_eduMsgSeq;
    twCanMessage(_urlId).then(function (st) {
      if (seq !== _eduMsgSeq || _isOwner) return;   // a newer render won
      var msg = twAction('message', { ownerId: _urlId, canMessage: st.can_message, onClick: openContact });
      if (msg) visitorEl.appendChild(msg);
    });
  }
}

// Unified owner/guest mode controller — single function for all owner UI transitions.
function _applyEduOwnerMode(isOwner) {
  var ownerEl   = document.getElementById('ownerActions');
  var visitorEl = document.getElementById('visitorActions');
  _isOwner = !!isOwner;
  if (ownerEl)   ownerEl.style.display   = _isOwner ? 'flex' : 'none';
  if (visitorEl) visitorEl.style.display = _isOwner ? 'none' : 'flex';
  if (!_isOwner && _editDlg) { _editDlg.close(); _editDlg = null; }
  _renderEduActions();
}

_applyEduOwnerMode(_isCurrentEduOwner());

function updateDisplay(){
  document.getElementById('profileName').textContent=_data.name||twT('edu.name_empty');
  document.getElementById('profileDesc').textContent=_data.desc||twT('edu.desc_empty');
  document.getElementById('profileLoc').textContent=_data.loc||'—';
  var a=document.getElementById('aboutWeb');
  if(a){
    // §54 rule 4b — only a safe http(s) URL becomes a link; otherwise plain text (no href)
    var _webSafe=_data.web?twSafeLinkUrl(_data.web):'';
    if(_webSafe){ a.href=_webSafe; a.target='_blank'; a.rel='noopener noreferrer'; } else if(a.removeAttribute) a.removeAttribute('href');
    a.textContent=_data.web||'—';
  }
  // DS-IMAGE — logo via the shared avatar builder (validated URL + letter fallback)
  var logo=document.getElementById('profileLogo');
  if(logo && _data.avatar && window.twAvatarEl && logo.replaceChildren){
    logo.replaceChildren(twAvatarEl({full_name:_data.name, avatar_url:_data.avatar, user_type:'edu'}, 'xl', {eager:true}));
  }
  _renderEduActions();
}

// Applies the public profile payload (GET /profile/{id}) — the only data source of this page.
function _applyEduProfile(data){
  var p = data && data.profile ? data.profile : {};
  if (p.full_name)  _data.name   = p.full_name;
  if (p.bio)        _data.desc   = p.bio;
  if (p.location)   _data.loc    = p.location;
  if (p.website)    _data.web    = p.website;
  if (p.avatar_url) _data.avatar = p.avatar_url;
  if (p.tw_id)      _data.twId   = String(p.tw_id);
  updateDisplay();
}
function _loadEduProfile(uid){
  if(!uid) return;
  twApi('/profile/'+encodeURIComponent(uid), { auth: false }).then(function(res){
    if (res.ok) _applyEduProfile(res.data);
    else console.error('[edu-profile] load failed', res.status);
  });
}

function _eduField(labelKey, value, multiline, attrs){
  var wrap=document.createElement('div');
  wrap.className='ep-field';
  var input=document.createElement(multiline ? 'textarea' : 'input');
  input.className='tw-input';
  input.id='ep-f-'+labelKey.split('.').pop();
  input.value=value||'';
  Object.keys(attrs||{}).forEach(function(k){ input.setAttribute(k, attrs[k]); });
  var label=document.createElement('label');
  label.setAttribute('for', input.id);
  label.textContent=twT(labelKey);
  wrap.appendChild(label);
  wrap.appendChild(input);
  return { wrap: wrap, input: input };
}

function openEditModal(){
  if (!_isCurrentEduOwner()) return;
  var f={
    name: _eduField('edu.edit.name', _data.name),
    desc: _eduField('edu.edit.desc', _data.desc, true, { placeholder: twT('edu.edit.desc_ph') }),
    loc:  _eduField('edu.edit.loc',  _data.loc,  false, { placeholder: twT('edu.edit.loc_ph') }),
    web:  _eduField('edu.edit.web',  _data.web,  false, { placeholder: 'https://', dir: 'ltr', type: 'url' }),
  };
  var form=document.createElement('div');
  form.className='ep-form';
  [f.name, f.desc, f.loc, f.web].forEach(function(x){ form.appendChild(x.wrap); });
  _editDlg = twModal({ title: twT('edu.edit.title'), content: form,
    onClose: function(){ _editDlg = null; },
    actions: [
      { text: twT('common.cancel') },
      { text: twT('common.save'), variant: 'primary', onClick: function(){ return saveEdit(f); } },
    ] });
}

// false keeps the dialog open (twModal) — success only when every request is ok
function saveEdit(f){
  if (!_isCurrentEduOwner()) return false;
  // Use live snapshot userId — never a cached user object.
  var _liveUserId = String(TwAuthSync.getSessionSnapshot().userId);
  var _webIn=f.web.input.value.trim();
  if(_webIn && !twSafeLinkUrl(_webIn)){ showToast(twT('edu.edit.web_invalid'),'error'); return false; }   // §54 rule 4b
  var _name=f.name.input.value.trim()||_data.name;
  var _desc=f.desc.input.value.trim();
  var _loc=f.loc.input.value.trim()||_data.loc;
  var _web=_webIn||_data.web;
  var reqs=[twApi('/profile/'+_liveUserId, { method:'PUT', body:{full_name:_name, bio:_desc, location:_loc, website:_web} })];
  if (_name!==_data.name) reqs.push(twApi('/auth/user/'+_liveUserId+'/name', { method:'PUT', body:{full_name:_name} }));
  return Promise.all(reqs).then(function(rs){
    var bad=rs.filter(function(r){ return !r.ok; })[0];
    if (bad) { showToast(twApiMessage(bad, twT('edu.edit.error')),'error'); return false; }
    _data.name=_name; _data.desc=_desc; _data.loc=_loc; _data.web=_web;
    updateDisplay();
    showToast(twT('edu.edit.saved'),'success');
  });
}

// Message → the shared messenger deep-link (same as emp / co). Guests: twAction sends them to login (NAV-07).
function openContact(){
  if(!_data.twId) return;
  window.location.href='/messages?with='+encodeURIComponent(_data.twId);
}

// ── Load profile from API ──
(function(){
  var snap = window.TwAuthSync && TwAuthSync.getSessionSnapshot ? TwAuthSync.getSessionSnapshot() : null;
  updateDisplay();
  _loadEduProfile(_urlId || (_isOwner && snap ? String(snap.userId) : null));
})();

// ── Auth-sync: VM-01 bfcache session revalidation (edu-profile) ──
// @vm-extract-begin: edu-authsync
(function(){
  if (!window.TwAuthSync) return;
  TwAuthSync.onSessionChange(function(info){
    var reason   = info && info.reason;
    var snapshot = (info && info.snapshot)
      || (window.TwAuthSync && TwAuthSync.getSessionSnapshot ? TwAuthSync.getSessionSnapshot() : null);

    // bfcache carve-out: same valid edu owner, page restored from bfcache → background-verify only
    if (reason === 'pageshow' &&
        snapshot && snapshot.isAuthenticated &&
        snapshot.userType === 'edu' &&
        snapshot.userId != null &&
        (!_urlId || String(snapshot.userId) === String(_urlId)) &&
        _isOwner) {
      _loadEduProfile(_urlId || String(snapshot.userId));
      return;
    }

    // Live ownership check — determines new mode after any non-carve-out session change.
    // _isCurrentEduOwner() is fail-closed: no TwAuthSync → false.
    var nowOwner = _isCurrentEduOwner();

    // Apply owner/guest mode unconditionally — also handles Guest→Owner on token refresh.
    _applyEduOwnerMode(nowOwner);

    // Background re-render with public data.
    _loadEduProfile(_urlId || (nowOwner && snapshot && snapshot.userId != null ? String(snapshot.userId) : null));
  });
})();
// @vm-extract-end: edu-authsync
</script>
</body>
</html>
