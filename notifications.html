<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Unified app header + bottom nav (HEADER-NAV.md) -->
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<meta name="tw-page" content="auth">
<style>
/* Notifications — page styles (DS-COLOR --color-* tokens only · local --nt-* = aliases) */
:root {
  --nt-border:       var(--color-border-subtle);
  --nt-border-hover: var(--color-border-medium);
  --nt-accent:       var(--color-brand-primary);
  --nt-accent-rgb:   var(--color-brand-primary-rgb);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-body);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
}

/* ── Page wrapper ── */
.notif-page {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px 40px; /* bottom nav clearance = body.tw-has-bnav (app-header.css) */
}

/* ── Hero ── */
.notif-hero {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 16px 10px;
}
.notif-hero-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.notif-title {
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: -.3px;
}
.notif-hero-bell {
  display: inline-flex;
  color: var(--nt-accent);
  filter: drop-shadow(0 0 7px rgba(var(--nt-accent-rgb),.6));
  flex-shrink: 0;
}
.notif-hero-bell svg { width: 28px; height: 28px; stroke-width: 1.8; }
.notif-subtitle {
  font-size: .78rem;
  color: var(--color-text-secondary);
  line-height: 1.4;
}

/* ── Filter tabs — profile-sections style with separators ── */
.notif-tabs-wrap {
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--nt-border);
  margin-bottom: 16px;
}
.notif-tabs-wrap::-webkit-scrollbar { display: none; }
.notif-tabs {
  display: flex;
  width: max-content;
  min-width: 100%;
}
.notif-tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 10px 14px;
  min-height: 38px;
  color: var(--color-text-secondary);
  font-family: 'Cairo', sans-serif;
  font-size: .75rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  background: none;
  position: relative;
  white-space: nowrap;
  flex-shrink: 0;
  transition: color .15s;
  border-inline-end: 1px solid var(--nt-border);
}
.notif-tab:last-child { border-inline-end: none; }
.notif-tab:hover { color: var(--color-text-body); }
.notif-tab.active { color: var(--nt-accent); }
.notif-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  inset-inline-start: 0;
  inset-inline-end: 0;
  height: 2px;
  background: var(--nt-accent);
  border-radius: 2px 2px 0 0;
}
.notif-tab svg { flex-shrink: 0; }

/* ── Action bar ── */
.notif-actions {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  margin-bottom: 16px;
}
.notif-markall-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 0;
  border: none;
  background: none;
  color: var(--nt-accent);
  font-family: 'Cairo', sans-serif;
  font-size: .75rem;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.notif-markall-btn:hover { opacity: .7; }
.notif-markall-btn:disabled { opacity: .4; cursor: default; }
.notif-markall-btn:focus-visible {
  outline: 2px solid var(--nt-accent);
  outline-offset: 3px;
  border-radius: 4px;
}
.notif-markall-btn svg { flex-shrink: 0; }

/* ── Notification card ── */
.notif-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  background: var(--color-surface-card);
  border: 1.5px solid var(--nt-border);
  border-radius: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .18s, background .18s;
  position: relative;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
}
.notif-card:hover {
  border-color: var(--nt-border-hover);
  background: var(--color-surface-raised);
}
.notif-card-unread {
  border-color: rgba(var(--nt-accent-rgb),.18);
  background: rgba(var(--nt-accent-rgb),.025);
}
/* Unread left-edge accent (RTL: right edge) */
.notif-card-unread::after {
  content: '';
  position: absolute;
  top: 14px;
  inset-inline-end: 0;
  width: 3px;
  height: calc(100% - 28px);
  background: var(--nt-accent);
  border-radius: 3px 0 0 3px;
}

/* Notification type icon — tone by data-tone (type → tone map in the script) */
.notif-card-ico {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-surface-hover);
  color: var(--color-text-secondary);
}
.notif-card-ico[data-tone="brand"]  { background: rgba(var(--color-brand-primary-rgb),.12);      color: var(--color-brand-primary); }
.notif-card-ico[data-tone="blue"]   { background: rgba(var(--color-brand-secondary-rgb),.12);    color: var(--color-brand-secondary); }
.notif-card-ico[data-tone="purple"] { background: rgba(var(--color-categorical-purple-rgb),.12); color: var(--color-categorical-purple); }
.notif-card-ico[data-tone="pink"]   { background: rgba(var(--color-categorical-pink-rgb),.12);   color: var(--color-categorical-pink); }

/* Card body */
.notif-card-body { flex: 1; min-width: 0; }
.notif-card-title {
  font-size: .82rem;
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 3px;
}
.notif-card-sub {
  font-size: .73rem;
  color: var(--color-text-secondary);
  line-height: 1.4;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.notif-card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.notif-card-time {
  font-size: .65rem;
  color: var(--color-text-muted);
}
.notif-card-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--nt-accent);
  flex-shrink: 0;
}

/* Group label */
.notif-group-lbl {
  font-size: .67rem;
  font-weight: 800;
  color: var(--color-text-muted);
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin: 8px 0 10px 0;
  padding-inline-end: 4px;
}

/* ── Empty / error state (one block — data-state="empty|error") ── */
.notif-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 64px 24px 40px;
  gap: 14px;
}
.notif-empty-icon {
  width: 72px;
  height: 72px;
  border-radius: 22px;
  background: rgba(var(--nt-accent-rgb),.07);
  border: 1.5px solid rgba(var(--nt-accent-rgb),.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--nt-accent);
  box-shadow: 0 0 28px rgba(var(--nt-accent-rgb),.09);
}
.notif-empty[data-state="error"] .notif-empty-icon {
  background: rgba(var(--color-status-danger-rgb),.07);
  border-color: rgba(var(--color-status-danger-rgb),.2);
  color: var(--color-status-danger);
  box-shadow: none;
}
.notif-empty-title {
  font-size: .95rem;
  font-weight: 800;
}
.notif-empty-sub {
  font-size: .78rem;
  color: var(--color-text-secondary);
  line-height: 1.6;
  max-width: 280px;
}
.notif-retry-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 10px;
  border: 1px solid rgba(var(--nt-accent-rgb),.3);
  background: rgba(var(--nt-accent-rgb),.08);
  color: var(--nt-accent);
  font-family: 'Cairo', sans-serif;
  font-size: .78rem;
  font-weight: 700;
  cursor: pointer;
}
.notif-retry-btn:focus-visible { outline: 2px solid var(--nt-accent); outline-offset: 3px; }

/* ── Skeleton (shared .tw-skeleton — page geometry only) ── */
#dynamicNotifs .tw-skeleton { height: 72px; margin-bottom: 8px; border-radius: 14px; }

/* Scroll progress */
.tw-scroll-prog {
  position: fixed; top: 0; left: 0;
  height: 2px; z-index: 999;
  background: linear-gradient(90deg, var(--color-brand-primary), var(--color-brand-secondary));
  transition: width .1s; width: 0;
}

/* Skip link */
.skip-link {
  position: absolute; top: -40px; right: 0;
  background: var(--nt-accent); color: var(--color-text-on-brand);
  padding: 8px 16px; border-radius: 0 0 8px 0;
  font-family: Cairo,sans-serif; font-size: .8rem; font-weight: 700;
  text-decoration: none; transition: top .2s; z-index: 10000;
}
.skip-link:focus { top: 0; }
/* ── V2-5: Aggregated notification badge ── */
.notif-agg-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--color-surface-hover);
  border: 1px solid var(--color-border-medium);
  font-size: .6rem;
  font-weight: 800;
  color: var(--color-text-secondary);
  flex-shrink: 0;
}
.notif-agg-badge svg { opacity: .7; }
.notif-card[data-aggregated="true"] { border-color: var(--color-border-default); }
.notif-card[data-aggregated="true"].notif-card-unread {
  border-color: rgba(var(--nt-accent-rgb),.22);
  background: rgba(var(--nt-accent-rgb),.03);
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<!-- ██ UNIFIED APP HEADER (HEADER-NAV.md — rendered by twMountAppChrome) ██ -->
<header data-tw-header></header>

<!-- ██ HERO ██ -->
<div class="notif-hero" id="main-content">
  <div class="notif-hero-row">
    <h1 class="notif-title" data-tw-t="notif.title"></h1>
    <span class="notif-hero-bell"><i data-tw-icon="notifications"></i></span>
  </div>
  <p class="notif-subtitle" data-tw-t="notif.subtitle"></p>
</div>

<!-- ██ MAIN CONTENT ██ -->
<div class="notif-page" role="main">

  <!-- Filter tabs -->
  <div class="notif-tabs-wrap" role="tablist" data-tw-t-label="notif.filter_label">
    <div class="notif-tabs">
      <button class="notif-tab active" data-filter="all" role="tab" aria-selected="true">
        <i data-tw-icon="inbox" data-tw-size="xs"></i><span data-tw-t="common.all"></span>
      </button>
      <button class="notif-tab" data-filter="job" role="tab" aria-selected="false">
        <i data-tw-icon="briefcase" data-tw-size="xs"></i><span data-tw-t="notif.tab.job"></span>
      </button>
      <button class="notif-tab" data-filter="comment" role="tab" aria-selected="false">
        <i data-tw-icon="comment" data-tw-size="xs"></i><span data-tw-t="notif.tab.comment"></span>
      </button>
      <button class="notif-tab" data-filter="follow" role="tab" aria-selected="false">
        <i data-tw-icon="user-plus" data-tw-size="xs"></i><span data-tw-t="notif.tab.follow"></span>
      </button>
      <button class="notif-tab" data-filter="verify" role="tab" aria-selected="false">
        <i data-tw-icon="shield-check" data-tw-size="xs"></i><span data-tw-t="notif.tab.verify"></span>
      </button>
    </div>
  </div>

  <!-- Action bar -->
  <div class="notif-actions">
    <button class="notif-markall-btn" id="markAllBtn" type="button">
      <i data-tw-icon="check" data-tw-size="xs"></i><span data-tw-t="notif.mark_all"></span>
    </button>
  </div>

  <!-- Notifications container — filled by JS with real API data only -->
  <div id="dynamicNotifs" aria-busy="true">
    <div class="tw-skeleton"></div>
    <div class="tw-skeleton"></div>
    <div class="tw-skeleton"></div>
  </div>

</div>

<!-- ██ UNIFIED BOTTOM NAV (HNAV-06) ██ -->
<nav data-tw-bottom-nav></nav>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script>
(function () {
  'use strict';
  /* Protected page guard (tw_shared.js — SHELL-09): TwAuthSync snapshot only; guest → /login?next= */
  var _snap = twRequireAuth();
  if (!_snap) return;
  var _uid = Number(_snap.userId);

  document.title = twT('page.title', { page: twT('notif.title') });
  twTApply(document.body);
  twIcon.hydrate(document.body);   /* static <i data-tw-icon> placeholders (DS-ICON) */

  /* ── Scroll progress ── */
  (function () {
    var p = document.createElement('div');
    p.className = 'tw-scroll-prog';
    document.body.prepend(p);
    window.addEventListener('scroll', function () {
      var pct = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight) * 100;
      p.style.width = Math.min(pct, 100) + '%';
    });
  })();

  /* ════════════════════════════════════════════════════════════
     NOTIFICATION SYSTEM — V1
       - every request through twApi (JWT + 401 handling are twApi's)
       - textContent for all API data — no innerHTML on API strings
       - Link validation — / prefix only
     ════════════════════════════════════════════════════════════ */

  /* Filter groups — maps tab data-filter to notification type values */
  var FILTER_GROUPS = {
    job:     ['job', 'job_applied'],
    comment: ['comment', 'reply', 'mention'],
    follow:  ['follow'],
    verify:  ['verify', 'kyc', 'verify_approved', 'verify_rejected']
  };

  /* Type → icon (DS-ICON) + tone (CSS data-tone → DS-COLOR tokens) + label key */
  var TYPE_MAP = {
    comment:     { icon: 'comment',      tone: 'blue',   filter: 'comment' },
    reply:       { icon: 'comment',      tone: 'blue',   filter: 'comment' },
    mention:     { icon: 'at-sign',      tone: 'purple', filter: 'comment' },
    job:         { icon: 'briefcase',    tone: 'brand',  filter: 'job' },
    job_applied: { icon: 'briefcase',    tone: 'brand',  filter: 'job' },
    follow:      { icon: 'user-plus',    tone: 'pink',   filter: 'follow' },
    verify:      { icon: 'shield-check', tone: 'brand',  filter: 'verify' },
    kyc:         { icon: 'shield-check', tone: 'brand',  filter: 'verify' },
    system:      { icon: 'notifications', tone: '',      filter: 'system' }
  };

  var APP_STATUSES = ['pending', 'viewed', 'accepted', 'rejected'];

  var _dyn = document.getElementById('dynamicNotifs');
  var _markBtn = document.getElementById('markAllBtn');
  var _unread = 0;          /* server unread count from the last successful load */
  var _filter = 'all';
  var _loadSeq = 0;

  function _agoLabel(createdAt) {
    var ago = Math.floor((Date.now() - new Date(createdAt)) / 60000);
    if (!(ago >= 1)) return twT('notif.time.now');
    if (ago < 60) return twT('notif.time.min', { n: ago });
    if (ago < 1440) return twT('notif.time.hour', { n: Math.floor(ago / 60) });
    return twT('notif.time.day', { n: Math.floor(ago / 1440) });
  }

  /* ── Build a notification card DOM node — all API text via textContent ── */
  /* V2-5: aggregation_count badge + data-aggregated / data-aggregation-kind attrs */
  function _buildNotifCard(n) {
    var type = TYPE_MAP[n.type] ? n.type : 'system';
    var t = TYPE_MAP[type];
    var isAgg = Boolean(n.aggregation_count && n.aggregation_count > 1);
    var aggCount = isAgg ? Number(n.aggregation_count) : 0;
    var link = (n.link && /^\//.test(n.link)) ? n.link : '';

    var card = document.createElement('div');
    card.className = 'notif-card' + (n.is_read ? '' : ' notif-card-unread');
    card.dataset.type = n.type || 'system';
    card.dataset.filterGroup = t.filter;
    if (link) card.dataset.link = link;
    if (isAgg) {
      card.dataset.aggregated = 'true';
      if (n.aggregation_kind) card.dataset.aggregationKind = String(n.aggregation_kind);
    }

    var ico = document.createElement('div');
    ico.className = 'notif-card-ico';
    if (t.tone) ico.dataset.tone = t.tone;
    ico.appendChild(twIconEl(t.icon, { size: 'lg' }));
    card.appendChild(ico);

    var body = document.createElement('div');
    body.className = 'notif-card-body';

    var titleEl = document.createElement('div');
    titleEl.className = 'notif-card-title';
    titleEl.textContent = String(n.title || twT('notif.type.' + type));   /* API data via textContent */
    body.appendChild(titleEl);

    if (n.body) {
      var subEl = document.createElement('div');
      subEl.className = 'notif-card-sub';
      subEl.textContent = String(n.body).slice(0, 80);                  /* API data via textContent */
      body.appendChild(subEl);
    }

    var metaEl = document.createElement('div');
    metaEl.className = 'notif-card-meta';

    if (isAgg) {
      var aggBadge = document.createElement('span');
      aggBadge.className = 'notif-agg-badge';
      aggBadge.setAttribute('aria-label', twT('notif.aggregated', { n: aggCount }));
      aggBadge.appendChild(twIconEl('layers', { size: 'xs' }));
      var aggNum = document.createElement('span');
      aggNum.textContent = String(aggCount);
      aggBadge.appendChild(aggNum);
      metaEl.appendChild(aggBadge);
    }

    var timeEl = document.createElement('span');
    timeEl.className = 'notif-card-time';
    timeEl.textContent = _agoLabel(n.created_at);
    metaEl.appendChild(timeEl);

    if (!n.is_read) {
      var dot = document.createElement('span');
      dot.className = 'notif-card-dot';
      dot.setAttribute('aria-label', twT('notif.unread'));
      metaEl.appendChild(dot);
    }

    body.appendChild(metaEl);
    card.appendChild(body);
    return card;
  }

  /* ── Empty / error state — one block, data-state="empty|error" ── */
  function _stateBlock(state, title, sub, onRetry) {
    var box = document.createElement('div');
    box.className = 'notif-empty';
    box.dataset.state = state;
    box.setAttribute('role', 'status');

    var iconWrap = document.createElement('div');
    iconWrap.className = 'notif-empty-icon';
    iconWrap.appendChild(twIconEl(state === 'error' ? 'alert' : 'notifications', { size: 'xl' }));
    box.appendChild(iconWrap);

    var titleEl = document.createElement('div');
    titleEl.className = 'notif-empty-title';
    titleEl.textContent = title;
    box.appendChild(titleEl);

    if (sub) {
      var subEl = document.createElement('div');
      subEl.className = 'notif-empty-sub';
      subEl.textContent = sub;
      box.appendChild(subEl);
    }

    if (onRetry) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'notif-retry-btn';
      btn.appendChild(twIconEl('refresh', { size: 'sm' }));
      var lbl = document.createElement('span');
      lbl.textContent = twT('notif.retry');
      btn.appendChild(lbl);
      btn.addEventListener('click', onRetry);
      box.appendChild(btn);
    }
    return box;
  }

  function _showSkeleton() {
    _dyn.textContent = '';
    _dyn.setAttribute('aria-busy', 'true');
    for (var i = 0; i < 3; i++) {
      var sk = document.createElement('div');
      sk.className = 'tw-skeleton';
      _dyn.appendChild(sk);
    }
  }

  /* ── Filter tabs — a filter with no matching card shows the filtered empty state ── */
  function _applyFilter() {
    document.querySelectorAll('.notif-tab').forEach(function (tab) {
      var isActive = tab.dataset.filter === _filter;
      tab.classList.toggle('active', isActive);
      tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    var groups = FILTER_GROUPS[_filter];
    var visible = 0;
    _dyn.querySelectorAll('.notif-card').forEach(function (card) {
      var show = _filter === 'all' || (groups && groups.indexOf(card.dataset.type) >= 0);
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    _dyn.querySelectorAll('.notif-group-lbl').forEach(function (lbl) {
      lbl.style.display = _filter === 'all' ? '' : 'none';
    });
    var old = _dyn.querySelector('.notif-empty[data-state="filtered"]');
    if (old) old.remove();
    if (!visible && _dyn.querySelector('.notif-card')) {
      _dyn.appendChild(_stateBlock('filtered', twT('notif.empty_filtered'), '', null));
    }
  }

  document.querySelectorAll('.notif-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      _filter = tab.dataset.filter;
      _applyFilter();
    });
  });

  /* Click-to-navigate — one delegated listener (link validated in _buildNotifCard) */
  _dyn.addEventListener('click', function (e) {
    var card = e.target.closest('.notif-card[data-link]');
    if (card && /^\//.test(card.dataset.link || '')) window.location.href = card.dataset.link;
  });

  function _appCard(a) {
    var status = APP_STATUSES.indexOf(a.status) >= 0 ? twT('notif.app.' + a.status) : String(a.status || '');
    return _buildNotifCard({
      type: 'job',
      is_read: a.status === 'pending',
      title: status + ' — ' + String(a.title || twT('notif.type.job')),
      body: String(a.company_name || '') + ' · ' + String((a.applied_at || '').slice(0, 10)),
      created_at: a.applied_at || new Date().toISOString(),
      link: ''
    });
  }

  /* ── Load notifications + job applications together (one render — no race, no white page) ── */
  function load() {
    var seq = ++_loadSeq;
    _showSkeleton();
    _markBtn.disabled = true;
    Promise.all([
      twApi('/notifications/' + _uid),
      twApi('/my/applications')
    ]).then(function (res) {
      if (seq !== _loadSeq) return;
      var nRes = res[0], aRes = res[1];
      _dyn.textContent = '';
      _dyn.removeAttribute('aria-busy');

      if (!nRes.ok) {
        _dyn.appendChild(_stateBlock('error', twT('notif.error_title'),
          twApiMessage(nRes, twT('common.check_connection')), load));
        return;
      }
      if (!aRes.ok) console.warn('[notifications] /my/applications failed:', aRes.status);

      var data = nRes.data || {};
      _unread = Number(data.unread) || 0;
      /* message-type notifications live in /messages */
      var notifs = (data.notifications || []).filter(function (n) {
        return n.type !== 'message' && !(n.link && String(n.link).indexOf('/messages') === 0);
      });
      var apps = (aRes.ok && aRes.data && aRes.data.applications) || [];

      if (!notifs.length && !apps.length) {
        _dyn.appendChild(_stateBlock('empty', twT('notif.empty_title'), twT('notif.empty_sub'), null));
        return;
      }

      if (notifs.length) {
        var lbl = document.createElement('div');
        lbl.className = 'notif-group-lbl';
        lbl.textContent = _unread > 0 ? twT('notif.group_new', { n: _unread }) : twT('notif.title');
        _dyn.appendChild(lbl);
        notifs.slice(0, 20).forEach(function (n) { _dyn.appendChild(_buildNotifCard(n)); });
      }
      if (apps.length) {
        var albl = document.createElement('div');
        albl.className = 'notif-group-lbl';
        albl.textContent = twT('notif.apps_group');
        _dyn.appendChild(albl);
        apps.slice(0, 5).forEach(function (a) { _dyn.appendChild(_appCard(a)); });
      }
      _markBtn.disabled = !_dyn.querySelector('.notif-card-unread');
      _applyFilter();

      /* Auto-mark all as read after viewing — header badge follows on success */
      if (_unread > 0) {
        twApi('/notifications/' + _uid + '/read', { method: 'PUT' }).then(function (r) {
          if (r.ok) { _unread = 0; twSetNotifBadge(0); }
          else console.warn('[notifications] auto mark-read failed:', r.status);
        });
      }
    });
  }

  /* ── Mark all as read — optimistic UI + header badge, rolled back on failure ── */
  function markAll() {
    var cards = Array.prototype.slice.call(_dyn.querySelectorAll('.notif-card-unread'));
    var prevUnread = _unread;
    cards.forEach(function (el) {
      el.classList.remove('notif-card-unread');
      var dot = el.querySelector('.notif-card-dot');
      if (dot) dot.hidden = true;
    });
    twSetNotifBadge(0);
    _markBtn.disabled = true;

    twApi('/notifications/' + _uid + '/read', { method: 'PUT' }).then(function (r) {
      if (r.ok) {
        _unread = 0;
        cards.forEach(function (el) {
          var dot = el.querySelector('.notif-card-dot');
          if (dot) dot.remove();
        });
        showToast(twT('notif.mark_all_done'), 'success');
        return;
      }
      /* rollback */
      cards.forEach(function (el) {
        el.classList.add('notif-card-unread');
        var dot = el.querySelector('.notif-card-dot');
        if (dot) dot.hidden = false;
      });
      twSetNotifBadge(prevUnread);
      _markBtn.disabled = false;
      showToast(twApiMessage(r, twT('notif.mark_all_failed')), 'error');
    });
  }
  _markBtn.addEventListener('click', markAll);

  load();
})();
</script>
</body>
</html>
