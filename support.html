<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Support — public (task 7.1 · 7.2a واجهة · docs/rules/support.md → الواجهة · SYSTEMS_INDEX §62).
     Route /support (server.py → support_page). Everyone: FAQ from GET /support/meta (texts twT support.faq.*) + search.
     Account: any category · GET / POST /support/tickets · GET /support/tickets/{id} · POST …/messages · POST …/close.
     Guest: «الدخول والحساب» only — POST /support/guest/code → /support/guest/tickets · POST /support/track/resend.
     Logic: static/support/support-form.js (shared pieces) + static/support/support.js. -->
<link rel="stylesheet" href="/static/app-header.css">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/support/support.css?v={{v:support.css}}">
<title></title>
<style>
body { background: var(--color-surface-page); color: var(--color-text-body); font-family: 'Cairo', sans-serif; min-height: 100vh; margin: 0; }
</style>
</head>
<body>
<header data-tw-header></header>

<main class="sp-main" id="main-content">
  <h1 class="sp-title"><i data-tw-icon="headset"></i><span data-tw-t="support.title"></span></h1>
  <p class="sp-sub" data-tw-t="support.subtitle"></p>

  <!-- FAQ + form + my tickets (hidden while a conversation is open) -->
  <div id="spHome">
    <section class="sp-sec">
      <h2 class="sp-sec-title" data-tw-t="support.faq.title"></h2>
      <div class="sp-field">
        <label class="sp-label" for="spSearch"><span data-tw-t="support.faq.search"></span></label>
        <input class="tw-input" type="search" id="spSearch" autocomplete="off">
      </div>
      <p class="sp-empty" id="spNoHits" data-tw-t="support.faq.no_hits" hidden></p>
      <div id="spFaq" aria-busy="true"><p class="sp-empty" data-tw-t="common.loading"></p></div>
    </section>
    <section class="sp-sec" id="spFormSec">
      <h2 class="sp-sec-title" data-tw-t="support.new.title"></h2>
      <div class="sp-card" id="spNew"></div>
    </section>
    <section class="sp-sec" id="spResendSec" hidden>
      <button type="button" class="sp-link" id="spResendBtn" data-tw-t="support.resend.link"></button>
      <div class="sp-card" id="spResend" hidden></div>
    </section>
    <section class="sp-sec" id="spMineSec" hidden>
      <h2 class="sp-sec-title" data-tw-t="support.mine.title"></h2>
      <div class="sp-card" id="spList" aria-busy="true"><p class="sp-empty" data-tw-t="common.loading"></p></div>
    </section>
  </div>

  <!-- one conversation -->
  <section class="sp-sec" id="spThread" hidden></section>
</main>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-options-data.js?v={{v:tw-options-data.js}}"></script>
<script src="/static/support/support-form.js?v={{v:support-form.js}}"></script>
<script src="/static/support/support.js?v={{v:support.js}}"></script>
</body>
</html>
