<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Unified app header (HEADER-NAV.md — guest view: logo · تسجيل الدخول · إنشاء حساب) -->
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<meta name="robots" content="noindex">
<!-- The reset token lives in the URL fragment; never leak the page URL to another site -->
<meta name="referrer" content="no-referrer">
<style>
/* Reset password — page styles (DS-COLOR --color-* tokens only) */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-surface-page);
  color: var(--color-text-body);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
}
.skip-link {
  position: absolute; top: -40px; right: 0;
  background: var(--color-brand-primary); color: var(--color-text-on-brand);
  padding: 8px 16px; border-radius: 0 0 10px 0;
  font-size: .78rem; font-weight: 700; text-decoration: none; transition: top .2s; z-index: 10000;
}
.skip-link:focus { top: 0; }
.rp-main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; }
.rp-card { background: var(--color-surface-card); border: 1px solid var(--color-border-subtle); border-radius: 16px; padding: 24px 20px; }
.rp-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 900; margin-bottom: 6px; }
.rp-title svg { color: var(--color-brand-primary); }
.rp-sub { font-size: .75rem; color: var(--color-text-muted); margin-bottom: 20px; line-height: 1.8; }
.rp-field { margin-bottom: 14px; }
.rp-field label { display: block; font-size: .72rem; font-weight: 700; margin-bottom: 6px; }
.rp-field.has-error .tw-input { border-color: var(--color-status-danger); }
.rp-err { display: none; font-size: .65rem; font-weight: 700; color: var(--color-status-danger); margin-top: 4px; }
.rp-field.has-error .rp-err { display: block; }
.rp-submit { width: 100%; margin-top: 6px; }
.rp-msg { font-size: .78rem; line-height: 1.8; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
          background: var(--color-surface-page); border: 1px solid var(--color-border-subtle); }
.rp-msg.is-error { border-color: var(--color-status-danger); color: var(--color-status-danger); }
.rp-links { margin-top: 16px; text-align: center; font-size: .72rem; }
.rp-links a { color: var(--color-brand-primary); font-weight: 700; text-decoration: none; }
.rp-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<header data-tw-header data-back="/login"></header>

<main class="rp-main" id="main-content">
  <div class="rp-card">
    <!-- Step 1: request a link (no #token) -->
    <section id="rpRequest" hidden>
      <h1 class="rp-title"><i data-tw-icon="lock"></i><span data-tw-t="reset.title"></span></h1>
      <p class="rp-sub" data-tw-t="reset.request_sub"></p>
      <div class="rp-msg" id="rpRequestMsg" role="status" aria-live="polite" hidden></div>
      <form id="rpRequestForm" novalidate>
        <div class="rp-field">
          <label for="rpEmail" data-tw-t="reset.email"></label>
          <input class="tw-input" id="rpEmail" type="email" autocomplete="email" dir="ltr"
                 spellcheck="false" placeholder="example@email.com" aria-describedby="rpEmailErr">
          <div class="rp-err" id="rpEmailErr" aria-live="polite"></div>
        </div>
        <button type="submit" class="tw-btn rp-submit" id="rpRequestBtn" data-tw-t="reset.send"></button>
      </form>
    </section>

    <!-- Step 2: new password (#token=… from the email link) -->
    <section id="rpNew" hidden>
      <h1 class="rp-title"><i data-tw-icon="lock"></i><span data-tw-t="reset.new_title"></span></h1>
      <p class="rp-sub" data-tw-t="reset.new_sub"></p>
      <div class="rp-msg" id="rpNewMsg" role="status" aria-live="polite" hidden></div>
      <form id="rpNewForm" novalidate>
        <div class="rp-field">
          <label for="rpPass" data-tw-t="reset.new_password"></label>
          <input class="tw-input" id="rpPass" type="password" autocomplete="new-password" aria-describedby="rpPassErr">
          <div class="rp-err" id="rpPassErr" aria-live="polite"></div>
        </div>
        <div class="rp-field">
          <label for="rpPass2" data-tw-t="reset.confirm_password"></label>
          <input class="tw-input" id="rpPass2" type="password" autocomplete="new-password" aria-describedby="rpPass2Err">
          <div class="rp-err" id="rpPass2Err" aria-live="polite"></div>
        </div>
        <button type="submit" class="tw-btn rp-submit" id="rpNewBtn" data-tw-t="reset.save"></button>
      </form>
      <div class="rp-links" id="rpRequestAgain" hidden><a href="/reset-password" data-tw-t="reset.request_new"></a></div>
    </section>

    <div class="rp-links" id="rpLoginLink"><a href="/login" data-tw-t="reset.back_login"></a></div>
  </div>
</main>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/reset-password/reset-password.js"></script>
</body>
</html>
