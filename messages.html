<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<!-- Unified app header (HEADER-NAV.md) -->
<link rel="stylesheet" href="/static/app-header.css">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/messages.css?v=v26">
<title></title>
<meta name="tw-page" content="auth">
<!-- This page owns the one WebSocket (messages.ws.js) — the shared badge socket stands down (HNAV-05) -->
<meta name="tw-ws" content="page">
</head>
<body>

<!-- ── Unified app header (HEADER-NAV.md — rendered by twMountAppChrome). No bottom nav here:
     the full-height chat keeps its input bar at the bottom. ── -->
<header data-tw-header></header>

<div class="layout" id="main-content">

  <!-- ── Conversations List ── -->
  <div class="conv-list" id="convList">
    <div class="msg-page-head">
      <h1 class="msg-page-title" data-tw-t="msg.title"></h1>
      <p class="msg-page-subtitle" data-tw-t="msg.subtitle"></p>
    </div>

    <div class="conv-toolbar">
      <div class="conv-search">
        <span class="cs-icon" aria-hidden="true"><i data-tw-icon="search" data-tw-size="sm"></i></span>
        <input class="cs-input" id="convSearch" data-tw-t-placeholder="msg.search_placeholder">
      </div>
      <div class="conv-filters" id="convFilters">
        <button class="cf-chip active" type="button" data-filter="all" data-tw-t="common.all"></button>
        <button class="cf-chip" type="button" data-filter="unread" data-tw-t="msg.filter_unread"></button>
      </div>
    </div>

    <div class="conv-items" id="convItems"></div>
  </div>

  <!-- ── Chat Panel ── -->
  <div class="chat" id="chatArea">

    <div class="chat-head" id="chatHead">
      <div class="ch-menu-wrap" id="chMenuWrap">
        <button type="button" class="ch-btn ch-menu-btn" id="chMenuBtn" data-msg-act="menu" data-tw-t-label="msg.menu" hidden>
          <i data-tw-icon="menu" data-tw-size="sm"></i>
        </button>
        <div class="ch-menu-dropdown" id="chMenuDropdown">
          <button type="button" class="ch-menu-item" data-msg-act="profile">
            <i data-tw-icon="user" data-tw-size="sm"></i><span data-tw-t="msg.view_profile"></span>
          </button>
          <button type="button" class="ch-menu-item" data-msg-act="copy">
            <i data-tw-icon="link" data-tw-size="sm"></i><span data-tw-t="msg.copy_link"></span>
          </button>
          <button type="button" class="ch-menu-item" data-msg-act="back">
            <i data-tw-icon="back" data-tw-size="sm"></i><span data-tw-t="msg.back"></span>
          </button>
          <button type="button" class="ch-menu-item ch-menu-item--disabled" disabled data-tw-t-label="msg.in_dev">
            <i data-tw-icon="settings" data-tw-size="sm"></i><span data-tw-t="msg.settings"></span>
            <span class="ch-menu-soon" data-tw-t="common.soon"></span>
          </button>
        </div>
      </div>
      <div class="ch-ava-wrap">
        <div class="ch-ava" id="chatAva"><i data-tw-icon="messages"></i></div>
      </div>
      <div class="ch-info">
        <div class="ch-name-row">
          <span class="ch-name" id="chatName" data-tw-t="msg.pick"></span>
          <span class="type-badge-pill" id="chatTypeBadge" hidden></span>
          <button type="button" class="ch-back-arrow" id="chBackArrow" data-msg-act="back" data-tw-t-label="msg.back" hidden>
            <i data-tw-icon="back" data-tw-size="sm"></i>
          </button>
        </div>
        <div class="ch-meta">
          <span class="ch-role" id="chatRole"></span>
          <span class="ch-status" id="chatStatus"></span>
        </div>
      </div>
      <div class="ch-sched" id="chatSchedSlot"></div>
    </div>

    <!-- Connection notice: shown only after the retry limit is reached (msgShowConnBar) -->
    <div class="msg-conn-bar" id="msgConnBar" role="status" hidden>
      <span class="msg-conn-text" id="msgConnText"></span>
      <button type="button" class="msg-conn-retry" data-msg-act="retry" data-tw-t="msg.retry"></button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-input" id="chatInput" hidden>
      <div class="input-wrap">
        <textarea class="msg-input" id="msgInput" data-tw-t-placeholder="msg.input_placeholder" rows="1"></textarea>
        <span class="attach-btn" data-tw-t-label="msg.attach_soon"><i data-tw-icon="upload" data-tw-size="sm"></i></span>
      </div>
      <button class="send-btn" type="button" data-msg-act="send" data-tw-t-label="msg.send"><i data-tw-icon="send"></i></button>
    </div>

  </div>
</div>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-schedule.js?v={{v:tw-schedule.js}}"></script>
<script src="/static/messages.state.js?v=v23"></script>
<script src="/static/messages.api.js?v=v23"></script>
<script src="/static/messages.ws.js?v=v26"></script>
<script src="/static/messages.render.js?v=v26"></script>
</body>
</html>
