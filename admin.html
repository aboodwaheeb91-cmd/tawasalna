<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head:admin-->
<!-- Admin panel root (task 5.3a · docs/rules/admin-shell.md). Route: server.py → admin_page (secret path).
     Login form + the sections of TW_ADMIN_SECTIONS whose path is '' or '#key' (one shown at a time).
     Overview = dashboard (task 5.3a2 — cards · tw-chart.js charts · queues · activity · system · audit).
     Logic: static/admin/admin.js · header / menu / confirm gate: static/shared/admin-shell.js. -->
<link rel="stylesheet" href="/static/shared/admin-shell.css?v={{v:admin-shell.css}}">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<title></title>
<style>
.adm-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-8) var(--space-6); }
.adm-login-box { width: 100%; max-width: 360px; background: var(--color-surface-card); border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-3xl); padding: var(--space-12) var(--space-9); display: flex; flex-direction: column; gap: var(--space-6); }
.adm-login-logo { height: 36px; width: auto; display: block; margin: 0 auto; }
.adm-login-sub { text-align: center; font-size: var(--size-font-sm); color: var(--color-text-muted); }
.adm-field { display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--size-font-xs); color: var(--color-text-secondary); font-weight: 700; }
.adm-login-btn { width: 100%; justify-content: center; }
.adm-login-err { min-height: 1em; text-align: center; font-size: var(--size-font-xs); color: var(--color-status-danger); }
.adm-logo-prev { height: 56px; border-radius: var(--radius-md); border: 1px dashed var(--color-border-strong); background: var(--color-surface-raised);
  display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--color-text-muted); cursor: pointer; width: 100%; }
.adm-logo-prev img { max-height: 48px; max-width: 100%; object-fit: contain; }
.adm-btns { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.adm-btns .tw-act { flex: 1; gap: var(--space-2); }
.adm-report { font-size: var(--size-font-xs); color: var(--color-text-secondary); line-height: 1.8; }
.adm-err-type { color: var(--color-status-danger); font-weight: 700; }
.adm-docs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.adm-doc-title { font-size: var(--size-font-xs); color: var(--color-text-muted); margin-bottom: var(--space-2); }
.adm-doc img { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius-md); background: var(--color-surface-raised); }
.adm-msg-form { display: flex; flex-direction: column; gap: var(--space-5); }
.adm-msg-form textarea { min-height: 96px; resize: vertical; }
/* dashboard (task 5.3a2) */
.adm-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); margin-bottom: var(--space-7); }
.adm-kpis .tw-adm-card.is-kpi { margin: 0; padding: var(--space-5) var(--space-6); }
.is-kpi .tw-adm-card-title { font-size: var(--size-font-xs); color: var(--color-text-secondary); }
.is-kpi .tw-adm-body { margin-top: var(--space-3); gap: var(--space-1); }
.adm-kpi-val { font-size: var(--size-font-2xl); font-weight: 900; color: var(--color-text-primary); }
.adm-kpi-chg { min-height: 1em; font-size: var(--size-font-2xs); color: var(--color-text-muted); }
.adm-kpi-chg.is-up { color: var(--color-status-success); }
.adm-kpi-chg.is-down { color: var(--color-status-danger); }
.adm-more { font-size: var(--size-font-xs); font-weight: 700; color: var(--color-brand-primary); text-decoration: none; }
.adm-more:hover { text-decoration: underline; }
.adm-dash { display: grid; gap: var(--space-7); }
.adm-col { min-width: 0; }
.adm-charts, .adm-queues { display: grid; gap: var(--space-7); }
.adm-charts .tw-adm-card, .adm-queues .tw-adm-card { margin: 0; }
.adm-charts { margin-bottom: var(--space-7); }
.adm-chart-sum { font-size: var(--size-font-xs); color: var(--color-text-muted); }
.adm-act { display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-4) 0; text-decoration: none;
  border-bottom: 1px solid var(--color-border-subtle); }
.adm-act:last-child { border-bottom: none; }
.adm-act-ico { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: var(--size-control-icon-sm);
  height: var(--size-control-icon-sm); border-radius: var(--radius-circle); color: var(--color-brand-primary);
  background: rgba(var(--color-brand-primary-rgb), .1); }
.adm-act-txt { display: flex; flex-direction: column; min-width: 0; }
.adm-act-title { font-size: var(--size-font-sm); font-weight: 700; color: var(--color-text-primary); overflow-wrap: anywhere; }
.adm-act-sub { font-size: var(--size-font-2xs); color: var(--color-text-muted); }
.adm-sys { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); font-size: var(--size-font-sm); }
.adm-sys-lbl { color: var(--color-text-secondary); }
.adm-pag-txt { align-self: center; font-size: var(--size-font-xs); color: var(--color-text-muted); }
/* jobs status tabs (task 5.3j) — same table classes as users below */
.adm-jtabs { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4); }
.adm-jtabs .tw-act.is-current { border-color: var(--color-brand-primary); color: var(--color-brand-primary); }
/* users / companies table (task 5.3a3) — table when its box is wide, compact rows when narrow (no horizontal scroll) */
.adm-utools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); margin-bottom: var(--space-4); }
.adm-usearch { flex: 2 1 220px; min-width: 0; }
.adm-usearch .tw-input { width: 100%; }
.adm-utools .adm-field { flex: 1 1 140px; min-width: 0; }
.adm-ucount { margin: 0 0 var(--space-3); }
.adm-uwrap { container-type: inline-size; }
.adm-utable { width: 100%; border-collapse: collapse; font-size: var(--size-font-sm); }
.adm-utable th { text-align: start; font-size: var(--size-font-xs); font-weight: 700; color: var(--color-text-muted);
  padding: var(--space-3) var(--space-3); border-bottom: 1px solid var(--color-border-subtle); }
.adm-utable td { padding: var(--space-4) var(--space-3); border-bottom: 1px solid var(--color-border-subtle); vertical-align: middle; }
.adm-utable tbody tr:last-child td { border-bottom: none; }
.adm-u-link { display: flex; align-items: center; gap: var(--space-4); min-width: 0; text-decoration: none; }
.adm-u-name { display: flex; flex-direction: column; min-width: 0; }
.adm-u-title { font-weight: 700; color: var(--color-text-primary); overflow-wrap: anywhere; }
.adm-u-link:hover .adm-u-title { color: var(--color-brand-primary); }
.adm-u-sub { font-size: var(--size-font-2xs); color: var(--color-text-muted); }
.adm-u-email { color: var(--color-text-secondary); overflow-wrap: anywhere; }
.adm-u-date { color: var(--color-text-muted); white-space: nowrap; }
.adm-u-btns { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.adm-u-btns .tw-act { gap: var(--space-2); }
@container (max-width: 719px) {
  .adm-utable thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .adm-utable, .adm-utable tbody { display: block; }
  .adm-utable tr { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);
    padding: var(--space-4) 0; border-bottom: 1px solid var(--color-border-subtle); }
  .adm-utable tbody tr:last-child { border-bottom: none; }
  .adm-utable td { display: block; padding: 0; border: none; min-width: 0; }
  .adm-u-who, .adm-u-email, .adm-u-acts { flex: 1 1 100%; }
  .adm-u-email { font-size: var(--size-font-xs); }
  .adm-u-date { font-size: var(--size-font-2xs); }
}
@media (min-width: 640px) { .adm-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } .adm-queues { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .adm-charts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .adm-dash { grid-template-columns: minmax(0, 1fr) 340px; } }
</style>
</head>
<body class="tw-adm-body-page">
<header data-tw-header="admin" hidden></header>

<!-- login (no admin session) -->
<div class="adm-login" id="loginWrap" hidden>
  <form class="adm-login-box" id="loginForm" novalidate>
    <img class="adm-login-logo" src="/static/33333.svg" alt="" width="120" height="36">
    <h1 class="adm-login-sub" data-tw-t="admin.shell.title"></h1>
    <label class="adm-field"><span data-tw-t="admin.login.user"></span>
      <input class="tw-input" id="admin-user" type="text" autocomplete="off" data-tw-t-placeholder="admin.login.user_ph"></label>
    <label class="adm-field"><span data-tw-t="admin.login.password"></span>
      <input class="tw-input" id="admin-pass" type="password" autocomplete="current-password"></label>
    <button type="submit" class="tw-act tw-act-primary adm-login-btn" id="loginBtn" data-tw-t="admin.login.submit"></button>
    <p class="adm-login-err" id="loginErr" role="alert"></p>
  </form>
</div>

<main class="tw-adm-main" id="main-content" hidden>
  <div class="tw-adm-section" data-adm-section="overview" id="sec-overview"></div>
  <div class="tw-adm-section" data-adm-section="users" id="sec-users" hidden></div>
  <div class="tw-adm-section" data-adm-section="companies" id="sec-companies" hidden></div>
  <div class="tw-adm-section" data-adm-section="jobs" id="sec-jobs" hidden></div>
  <div class="tw-adm-section" data-adm-section="kyc" id="sec-kyc" hidden></div>
  <div class="tw-adm-section" data-adm-section="reports" id="sec-reports" hidden></div>
  <div class="tw-adm-section" data-adm-section="audit" id="sec-audit" hidden></div>
  <div class="tw-adm-section" data-adm-section="activity" id="sec-activity" hidden></div>
  <div class="tw-adm-section" data-adm-section="errors" id="sec-errors" hidden></div>
  <div class="tw-adm-section" data-adm-section="system" id="sec-system" hidden></div>
</main>

<!--tw:strings-->
<!--tw:shell-scripts:admin-->
<script src="/static/shared/admin-session.js"></script>
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/admin-sections.js?v={{v:admin-sections.js}}"></script>
<script src="/static/shared/admin-shell.js?v={{v:admin-shell.js}}"></script>
<script src="/static/shared/admin-jobs.js?v={{v:admin-jobs.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-chart.js?v={{v:tw-chart.js}}"></script>
<script src="/static/admin/admin.js?v={{v:admin.js}}"></script>
</body>
</html>
