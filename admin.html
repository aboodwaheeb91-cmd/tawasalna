<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head:admin-->
<!-- Admin panel root (task 5.3a · docs/rules/admin-shell.md). Route: server.py → admin_page (secret path).
     Login form + the sections of TW_ADMIN_SECTIONS whose path is '' or '#key' (one shown at a time).
     Logic: static/admin/admin.js · header / menu / confirm gate: static/shared/admin-shell.js. -->
<link rel="stylesheet" href="/static/shared/admin-shell.css?v={{v:admin-shell.css}}">
<title></title>
<style>
.adm-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--space-8) var(--space-6); }
.adm-login-box { width: 100%; max-width: 360px; background: var(--color-surface-card); border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-3xl); padding: var(--space-12) var(--space-9); display: flex; flex-direction: column; gap: var(--space-6); }
.adm-login-logo { height: 36px; width: auto; display: block; margin: 0 auto; }
.adm-login-sub { text-align: center; font-size: var(--size-font-sm); color: var(--color-text-muted); }
.adm-field { display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--size-font-xs); color: var(--color-text-secondary); font-weight: 700; }
.adm-login-btn { width: 100%; justify-content: center; }
.adm-login-err { min-height: 1em; text-align: center; font-size: var(--size-font-xs); color: var(--color-status-danger); }
.adm-logo-prev { height: 56px; border-radius: var(--radius-md); border: 1px dashed var(--color-border-strong); background: var(--color-surface-raised);
  display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--color-text-muted); cursor: pointer; width: 100%; }
.adm-logo-prev img { max-height: 48px; max-width: 100%; object-fit: contain; }
.adm-btns { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.adm-btns .tw-act { flex: 1; gap: var(--space-2); }
.adm-report { font-size: var(--size-font-xs); color: var(--color-text-secondary); line-height: 1.8; }
.adm-err-type { color: var(--color-status-danger); font-weight: 700; }
.adm-docs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.adm-doc-title { font-size: var(--size-font-xs); color: var(--color-text-muted); margin-bottom: var(--space-2); }
.adm-doc img { width: 100%; max-height: 220px; object-fit: contain; border-radius: var(--radius-md); background: var(--color-surface-raised); }
.adm-msg-form { display: flex; flex-direction: column; gap: var(--space-5); }
.adm-msg-form textarea { min-height: 96px; resize: vertical; }
</style>
</head>
<body class="tw-adm-body-page">
<header data-tw-header="admin" hidden></header>

<!-- login (no admin session) -->
<div class="adm-login" id="loginWrap" hidden>
  <form class="adm-login-box" id="loginForm" novalidate>
    <img class="adm-login-logo" src="/static/33333.svg" alt="" width="120" height="36">
    <h1 class="adm-login-sub" data-tw-t="admin.shell.title"></h1>
    <label class="adm-field"><span data-tw-t="admin.login.user"></span>
      <input class="tw-input" id="admin-user" type="text" autocomplete="off" data-tw-t-placeholder="admin.login.user_ph"></label>
    <label class="adm-field"><span data-tw-t="admin.login.password"></span>
      <input class="tw-input" id="admin-pass" type="password" autocomplete="current-password"></label>
    <button type="submit" class="tw-act tw-act-primary adm-login-btn" id="loginBtn" data-tw-t="admin.login.submit"></button>
    <p class="adm-login-err" id="loginErr" role="alert"></p>
  </form>
</div>

<main class="tw-adm-main" id="main-content" hidden>
  <div class="tw-adm-section" data-adm-section="overview" id="sec-overview"></div>
  <div class="tw-adm-section" data-adm-section="users" id="sec-users" hidden></div>
  <div class="tw-adm-section" data-adm-section="jobs" id="sec-jobs" hidden></div>
  <div class="tw-adm-section" data-adm-section="reports" id="sec-reports" hidden></div>
  <div class="tw-adm-section" data-adm-section="kyc" id="sec-kyc" hidden></div>
  <div class="tw-adm-section" data-adm-section="errors" id="sec-errors" hidden></div>
  <div class="tw-adm-section" data-adm-section="system" id="sec-system" hidden></div>
</main>

<!--tw:strings-->
<!--tw:shell-scripts:admin-->
<script src="/static/shared/admin-session.js"></script>
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/admin-sections.js?v={{v:admin-sections.js}}"></script>
<script src="/static/shared/admin-shell.js?v={{v:admin-shell.js}}"></script>
<script src="/static/admin/admin.js?v={{v:admin.js}}"></script>
</body>
</html>
