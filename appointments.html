<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<title>مواعيدي — تواصلنا</title>
<meta name="tw-page" content="auth">
<style>
/* Appointments — page styles (Phase C: DS-COLOR --color-* · DS-SIZE tokens · local --ap-* = values with no matching token) */
:root{
  --ap-border:rgba(255,255,255,.07);
  --ap-text:#e8eaf0;--ap-text-sub:#8892a4;--ap-danger:#ef4444;--ap-warn:#f59e0b;
  --ap-surface-modal:#0d1526;
  --r:var(--radius-xl);--font:'Cairo',sans-serif
}
body{background:var(--color-surface-page);color:var(--ap-text);font-family:var(--font);min-height:100vh;padding-bottom:80px}
/* Header */
.hdr{position:sticky;top:0;z-index:100;background:rgba(7,11,24,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--ap-border);padding:var(--space-7) var(--space-10);display:flex;align-items:center;gap:var(--space-6)}
.hdr-title{font-size:17px;font-weight:700;color:var(--ap-text);flex:1}
.hdr-back{width:36px;height:36px;border-radius:var(--radius-md);border:1px solid var(--ap-border);background:var(--color-surface-card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ap-text-sub);
  text-decoration:none}
/* Filter bar */
.fbar{padding:var(--space-6) var(--space-8);display:flex;gap:var(--space-4);overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.ftab{padding:var(--space-3) var(--space-8);border-radius:var(--radius-3xl);border:1px solid var(--ap-border);background:var(--color-surface-card);
  color:var(--ap-text-sub);font-size:var(--size-font-md);font-family:var(--font);cursor:pointer;white-space:nowrap;transition:.2s}
.ftab.active{background:rgba(var(--color-brand-primary-rgb),.12);border-color:var(--color-brand-primary);color:var(--color-brand-primary)}
/* Content */
.content{padding:var(--space-6) var(--space-8)}
/* Cards */
.appt-card{background:var(--color-surface-card);border:1px solid var(--ap-border);border-radius:var(--r);
  padding:var(--space-8);margin-bottom:var(--space-6);transition:.2s;cursor:pointer}
.appt-card:hover{border-color:rgba(var(--color-brand-primary-rgb),.3);background:rgba(255,255,255,.05)}
.card-top{display:flex;align-items:flex-start;gap:var(--space-6);margin-bottom:var(--space-6)}
.card-info{flex:1;min-width:0}
.card-name{font-size:var(--size-font-xl);font-weight:700;color:var(--ap-text);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-job{font-size:var(--size-font-md);color:var(--ap-text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:3px var(--space-5);border-radius:var(--radius-3xl);
  font-size:11px;font-weight:700}
.badge-pending{background:rgba(245,158,11,.12);color:var(--ap-warn)}
.badge-confirmed{background:rgba(var(--color-brand-primary-rgb),.12);color:var(--color-brand-primary)}
.badge-cancelled{background:rgba(239,68,68,.12);color:var(--ap-danger)}
.badge-reschedule{background:rgba(139,92,246,.12);color:var(--color-brand-accent)}
.badge-expired{background:rgba(239,68,68,.1);color:var(--color-status-danger)}
.badge-completed{background:rgba(var(--color-brand-secondary-rgb),.12);color:var(--color-brand-secondary)}
.badge-closed{background:rgba(255,255,255,.06);color:var(--ap-text-sub)}
.badge-draft{background:rgba(255,255,255,.06);color:var(--ap-text-sub)}
.badge-missed{background:rgba(239,68,68,.1);color:var(--color-status-danger)}
.card-meta{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.meta-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--size-font-xs);color:var(--ap-text-sub)}
.meta-item .tw-ico{flex-shrink:0}
.card-footer{margin-top:var(--space-6);display:flex;justify-content:flex-start}
.btn-room{display:inline-flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-9);border-radius:var(--radius-md);
  background:rgba(var(--color-brand-primary-rgb),.1);border:1px solid rgba(var(--color-brand-primary-rgb),.25);color:var(--color-brand-primary);
  font-size:var(--size-font-md);font-weight:700;font-family:var(--font);cursor:pointer;text-decoration:none;
  transition:.2s}
.btn-room:hover{background:rgba(var(--color-brand-primary-rgb),.2)}
/* New appointment button */
.fab{position:fixed;bottom:90px;left:20px;width:52px;height:52px;border-radius:var(--radius-circle);
  background:var(--color-brand-primary);color:var(--color-text-primary);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(var(--color-brand-primary-rgb),.4);
  transition:.2s}
.fab:hover{transform:scale(1.05)}
/* Empty / loading */
.empty{text-align:center;padding:60px var(--space-10);color:var(--ap-text-sub)}
.empty-icon{margin-bottom:var(--space-6);opacity:.5;display:flex;justify-content:center}
.empty-icon .tw-ico{width:48px;height:48px}
.empty-txt{font-size:var(--size-font-xl);margin-bottom:var(--space-3);color:var(--ap-text)}
.empty-sub{font-size:var(--size-font-md)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}
.sk-card{height:120px;margin-bottom:var(--space-6);border-radius:var(--r)}
/* Create modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--ap-surface-modal);border-radius:var(--radius-3xl) var(--radius-3xl) 0 0;padding:var(--space-11) var(--space-10) var(--space-13);
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:.2s}
.modal-bg.open .modal{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:var(--space-10)}
.form-group{margin-bottom:var(--space-8)}
.form-label{font-size:var(--size-font-md);color:var(--ap-text-sub);margin-bottom:var(--space-3);display:block}
.form-hint{color:var(--ap-text-sub);font-size:var(--size-font-xs);display:block;margin-top:var(--space-2)}
.form-input{width:100%;padding:var(--space-5) var(--space-7);border-radius:var(--radius-md);border:1px solid var(--ap-border);
  background:rgba(255,255,255,.04);color:var(--ap-text);font-family:var(--font);font-size:var(--size-font-lg)}
.form-input:focus{outline:none;border-color:var(--color-brand-primary)}
.form-select{width:100%;padding:var(--space-5) var(--space-7);border-radius:var(--radius-md);border:1px solid var(--ap-border);
  background:var(--ap-surface-modal);color:var(--ap-text);font-family:var(--font);font-size:var(--size-font-lg);cursor:pointer}
.btn-submit{width:100%;padding:var(--space-6);border-radius:var(--radius-lg);background:var(--color-brand-primary);color:var(--color-text-primary);
  border:none;font-size:var(--size-font-xl);font-weight:700;font-family:var(--font);cursor:pointer;margin-top:var(--space-4)}
.btn-cancel-modal{width:100%;padding:var(--space-6);border-radius:var(--radius-lg);background:var(--color-surface-card);color:var(--ap-text-sub);
  border:1px solid var(--ap-border);font-size:var(--size-font-xl);font-family:var(--font);cursor:pointer;margin-top:var(--space-4)}
/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;height:65px;background:rgba(7,11,24,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--ap-border);display:flex;
  align-items:center;justify-content:space-around;z-index:100}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ap-text-sub);
  text-decoration:none;font-size:var(--size-font-3xs);padding:var(--space-3) var(--space-6)}
.bnav-item.active{color:var(--color-brand-primary)}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" id="hdrBack" href="/home" aria-label="رجوع"><i data-tw-icon="back" data-tw-size="lg"></i></a>
  <span class="hdr-title">مواعيدي</span>
</div>

<div class="fbar" id="filterBar">
  <button class="ftab active" data-f="">الكل</button>
  <button class="ftab" data-f="pending_response">بانتظار الرد</button>
  <button class="ftab" data-f="confirmed">مؤكَّد</button>
  <button class="ftab" data-f="reschedule_requested">طلب تغيير</button>
  <button class="ftab" data-f="cancelled">ملغي</button>
  <button class="ftab" data-f="completed">مكتمل</button>
</div>

<div class="content" id="apptList">
  <div class="skeleton sk-card"></div>
  <div class="skeleton sk-card"></div>
  <div class="skeleton sk-card"></div>
</div>

<!-- Company: New Appointment FAB -->
<button class="fab" id="fabNew" title="دعوة مقابلة جديدة" aria-label="دعوة مقابلة جديدة" style="display:none"><i data-tw-icon="add"></i></button>

<!-- New Appointment Modal (company only) -->
<div class="modal-bg" id="newApptModal">
  <div class="modal">
    <div class="modal-title">دعوة مقابلة جديدة</div>
    <div class="form-group">
      <label class="form-label">رقم طلب التوظيف (application_id)</label>
      <input class="form-input" id="fApplication" type="number" placeholder="رقم الطلب من صفحة التقديمات">
      <small class="form-hint">احصل على الرقم من صفحة تقديمات الوظيفة</small>
    </div>
    <div class="form-group">
      <label class="form-label">نوع المقابلة</label>
      <select class="form-select" id="fMode">
        <option value="online">أونلاين</option>
        <option value="onsite">حضوري</option>
      </select>
    </div>
    <div class="form-group" id="urlGroup">
      <label class="form-label">رابط الاجتماع (https://...)</label>
      <input class="form-input" id="fUrl" type="url" placeholder="https://meet.google.com/...">
    </div>
    <div class="form-group" id="locGroup" style="display:none">
      <label class="form-label">موقع المقابلة</label>
      <input class="form-input" id="fLoc" type="text" placeholder="العنوان التفصيلي">
    </div>
    <div class="form-group">
      <label class="form-label">ملاحظات (اختياري)</label>
      <input class="form-input" id="fNotes" type="text" placeholder="أي معلومات إضافية">
    </div>
    <button class="btn-submit" id="btnCreateAppt">إنشاء الدعوة</button>
    <button class="btn-cancel-modal" id="btnCloseModal">إلغاء</button>
  </div>
</div>

<nav class="bnav">
  <a class="bnav-item" href="/home">
    <i data-tw-icon="home" data-tw-size="2xl"></i>
    الرئيسية
  </a>
  <a class="bnav-item active" href="/appointments">
    <i data-tw-icon="calendar" data-tw-size="2xl"></i>
    مواعيد
  </a>
  <a class="bnav-item" href="/messages">
    <i data-tw-icon="messages" data-tw-size="2xl"></i>
    رسائل
  </a>
  <a class="bnav-item" href="/notifications">
    <i data-tw-icon="notifications" data-tw-size="2xl"></i>
    إشعارات
  </a>
</nav>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script>
(function(){
  'use strict';
  // Protected page guard (tw_shared.js) — TwAuthSync snapshot only; guest → /login?next=
  const _snap = twRequireAuth();
  if (!_snap) return;

  const IS_CO = _snap.userType === 'co';
  let _currentFilter = '';

  // Status labels + badge classes
  const STATUS_LABEL = {
    draft: 'مسودة', pending_response: 'بانتظار الرد',
    reschedule_requested: 'طلب تغيير موعد', confirmed: 'مؤكَّد',
    cancelled: 'ملغي', expired: 'انتهت المهلة', missed: 'فائت',
    completed: 'مكتملة', closed: 'مغلق'
  };
  const STATUS_CLASS = {
    draft: 'badge-draft', pending_response: 'badge-pending',
    reschedule_requested: 'badge-reschedule', confirmed: 'badge-confirmed',
    cancelled: 'badge-cancelled', expired: 'badge-expired',
    missed: 'badge-missed', completed: 'badge-completed', closed: 'badge-closed'
  };
  const MODE_LABEL = { online: 'أونلاين', onsite: 'حضوري' };

  // DOM
  const listEl = document.getElementById('apptList');
  const fabNew = document.getElementById('fabNew');
  const modal  = document.getElementById('newApptModal');
  const fMode  = document.getElementById('fMode');
  const urlGrp = document.getElementById('urlGroup');
  const locGrp = document.getElementById('locGroup');

  twIcon.hydrate(document.body);   // static <i data-tw-icon> placeholders (DS-ICON)
  document.getElementById('hdrBack').href = twHomeHref();

  if (IS_CO) { fabNew.style.display = 'flex'; }

  // Filter tabs
  document.getElementById('filterBar').addEventListener('click', function(e){
    const tab = e.target.closest('.ftab');
    if (!tab) return;
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    _currentFilter = tab.dataset.f || '';
    loadAppointments();
  });

  // Authorization via getAuthHeaders (tw_shared.js). 401 → TwAuthSync.invalidateSession →
  // the page guard sends the visitor to /login?next= (same path as an expired session).
  function api(path, opts){
    return fetch(path, Object.assign({ headers: getAuthHeaders(true) }, opts)).then(function(r){
      if (r.status === 401 && window.TwAuthSync) TwAuthSync.invalidateSession('api_401');
      return r.json();
    });
  }

  // Error text from any API error shape (normalizeErrorResponse — FBK M15)
  function errMsg(res, fallback){
    const g = normalizeErrorResponse(res).generalError;
    return (g && g.code !== 'unknown' && g.message) || fallback;
  }

  function formatDate(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString('ar-JO', { dateStyle: 'medium', timeStyle: 'short' });
    } catch(e){ return iso; }
  }

  function metaItem(icon, text){
    const mi = document.createElement('div');
    mi.className = 'meta-item';
    mi.appendChild(twIconEl(icon, { size: 'sm' }));
    const span = document.createElement('span');
    safeText(span, text);
    mi.appendChild(span);
    return mi;
  }

  function stateBox(icon, title, sub){
    const box = document.createElement('div');
    box.className = 'empty';
    const ic = document.createElement('div');
    ic.className = 'empty-icon';
    ic.appendChild(twIconEl(icon));
    box.appendChild(ic);
    const t = document.createElement('div');
    t.className = 'empty-txt';
    safeText(t, title);
    box.appendChild(t);
    if (sub) {
      const s = document.createElement('div');
      s.className = 'empty-sub';
      safeText(s, sub);
      box.appendChild(s);
    }
    return box;
  }

  function renderCard(a){
    const s = a.computed_status || a.status;
    const cls = STATUS_CLASS[s] || 'badge-draft';
    const lbl = STATUS_LABEL[s] || s;

    const card = document.createElement('div');
    card.className = 'appt-card';
    card.addEventListener('click', function(){
      location.href = '/appointment-room?id=' + encodeURIComponent(a.id);
    });

    const displayName = IS_CO ? a.applicant_name : a.company_name;
    const jobTxt = a.job_title ? a.job_title : 'مقابلة عامة';

    const top = document.createElement('div');
    top.className = 'card-top';

    // DS-IMAGE: the other side — applicant (emp) for a company, company (co) otherwise
    const ava = twAvatarEl({ full_name: displayName, user_type: IS_CO ? 'emp' : 'co' }, 'lg');

    const info = document.createElement('div');
    info.className = 'card-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    safeText(nameEl, displayName);
    const jobEl = document.createElement('div');
    jobEl.className = 'card-job';
    safeText(jobEl, jobTxt);
    info.appendChild(nameEl);
    info.appendChild(jobEl);

    const badge = document.createElement('span');
    badge.className = 'badge ' + cls;
    safeText(badge, lbl);

    top.appendChild(ava);
    top.appendChild(info);
    top.appendChild(badge);
    card.appendChild(top);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    if (a.scheduled_at) meta.appendChild(metaItem('clock', formatDate(a.scheduled_at)));
    meta.appendChild(metaItem('calendar', MODE_LABEL[a.mode] || a.mode));
    card.appendChild(meta);

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const btnRoom = document.createElement('a');
    btnRoom.className = 'btn-room';
    btnRoom.href = '/appointment-room?id=' + encodeURIComponent(a.id);
    btnRoom.appendChild(twIconEl('log-in', { size: 'sm' }));
    btnRoom.appendChild(document.createTextNode(' فتح غرفة الموعد'));
    footer.appendChild(btnRoom);
    card.appendChild(footer);

    return card;
  }

  function loadAppointments(){
    listEl.innerHTML = '<div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>';
    const qs = _currentFilter ? '?status=' + encodeURIComponent(_currentFilter) : '';
    api('/api/appointments' + qs).then(res => {
      listEl.innerHTML = '';
      if (!res.ok) {
        listEl.appendChild(stateBox('alert', 'خطأ في تحميل البيانات',
          errMsg(res, 'تحقق من اتصالك وحاول مرة أخرى')));
        return;
      }
      if (!res.data || res.data.length === 0) {
        listEl.appendChild(stateBox('calendar', 'لا توجد مواعيد',
          _currentFilter ? 'لا توجد مواعيد بهذه الحالة' : 'لم تصلك دعوات مقابلات بعد'));
        return;
      }
      res.data.forEach(a => listEl.appendChild(renderCard(a)));
    }).catch(function(){
      listEl.innerHTML = '';
      listEl.appendChild(stateBox('alert', 'خطأ في تحميل البيانات'));
    });
  }

  // Create appointment modal (company only)
  fabNew.addEventListener('click', function(){ modal.classList.add('open'); });
  document.getElementById('btnCloseModal').addEventListener('click', function(){
    modal.classList.remove('open');
  });
  modal.addEventListener('click', function(e){
    if (e.target === modal) modal.classList.remove('open');
  });

  fMode.addEventListener('change', function(){
    urlGrp.style.display = fMode.value === 'online' ? '' : 'none';
    locGrp.style.display = fMode.value === 'onsite' ? '' : 'none';
  });

  document.getElementById('btnCreateAppt').addEventListener('click', function(){
    const application_id = parseInt(document.getElementById('fApplication').value);
    if (!application_id) { showToast('أدخل رقم طلب التوظيف', 'warning'); return; }
    const mode = fMode.value;
    const payload = {
      application_id,
      mode,
      online_url: mode === 'online' ? (document.getElementById('fUrl').value.trim() || null) : null,
      location_text: mode === 'onsite' ? (document.getElementById('fLoc').value.trim() || null) : null,
      notes: document.getElementById('fNotes').value.trim() || null
    };
    api('/api/appointments', { method: 'POST', body: JSON.stringify(payload) }).then(res => {
      if (res.ok) {
        modal.classList.remove('open');
        location.href = '/appointment-room?id=' + encodeURIComponent(res.data.id);
      } else {
        showToast(errMsg(res, 'خطأ في إنشاء الموعد'), 'error');
      }
    }).catch(function(){ showToast('خطأ في الاتصال', 'error'); });
  });

  loadAppointments();
})();
</script>
</body>
</html>
