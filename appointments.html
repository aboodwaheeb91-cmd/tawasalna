<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<meta name="tw-page" content="auth">
<style>
/* Appointments — page styles (Phase C: DS-COLOR --color-* · DS-SIZE tokens · local --ap-* = values with no matching token) */
:root{
  --ap-border:rgba(255,255,255,.07);
  --ap-text:#e8eaf0;--ap-text-sub:#8892a4;--ap-danger:#ef4444;--ap-warn:#f59e0b;
  --r:var(--radius-xl);--font:'Cairo',sans-serif
}
body{background:var(--color-surface-page);color:var(--ap-text);font-family:var(--font);min-height:100vh}
/* Header + bottom nav = unified app chrome (app-header.css · HEADER-NAV.md) */
.ap-title{font-size:17px;font-weight:700;color:var(--ap-text);padding:var(--space-7) var(--space-10) 0}
/* Filter bar */
.fbar{padding:var(--space-6) var(--space-8);display:flex;gap:var(--space-4);overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.ftab{padding:var(--space-3) var(--space-8);border-radius:var(--radius-3xl);border:1px solid var(--ap-border);background:var(--color-surface-card);
  color:var(--ap-text-sub);font-size:var(--size-font-md);font-family:var(--font);cursor:pointer;white-space:nowrap;transition:.2s}
.ftab.active{background:rgba(var(--color-brand-primary-rgb),.12);border-color:var(--color-brand-primary);color:var(--color-brand-primary)}
/* Content */
.content{padding:var(--space-6) var(--space-8)}
/* Cards */
.appt-card{background:var(--color-surface-card);border:1px solid var(--ap-border);border-radius:var(--r);
  padding:var(--space-8);margin-bottom:var(--space-6);transition:.2s;cursor:pointer}
.appt-card:hover{border-color:rgba(var(--color-brand-primary-rgb),.3);background:rgba(255,255,255,.05)}
.card-top{display:flex;align-items:flex-start;gap:var(--space-6);margin-bottom:var(--space-6)}
.card-info{flex:1;min-width:0}
.card-name{font-size:var(--size-font-xl);font-weight:700;color:var(--ap-text);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-job{font-size:var(--size-font-md);color:var(--ap-text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:3px var(--space-5);border-radius:var(--radius-3xl);
  font-size:11px;font-weight:700}
.badge-pending{background:rgba(245,158,11,.12);color:var(--ap-warn)}
.badge-confirmed{background:rgba(var(--color-brand-primary-rgb),.12);color:var(--color-brand-primary)}
.badge-cancelled{background:rgba(239,68,68,.12);color:var(--ap-danger)}
.badge-reschedule{background:rgba(139,92,246,.12);color:var(--color-brand-accent)}
.badge-expired{background:rgba(239,68,68,.1);color:var(--color-status-danger)}
.badge-completed{background:rgba(var(--color-brand-secondary-rgb),.12);color:var(--color-brand-secondary)}
.badge-closed{background:rgba(255,255,255,.06);color:var(--ap-text-sub)}
.badge-draft{background:rgba(255,255,255,.06);color:var(--ap-text-sub)}
.badge-missed{background:rgba(239,68,68,.1);color:var(--color-status-danger)}
.card-meta{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}
.meta-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--size-font-xs);color:var(--ap-text-sub)}
.meta-item .tw-ico{flex-shrink:0}
.card-footer{margin-top:var(--space-6);display:flex;justify-content:flex-start}
.btn-room{display:inline-flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-9);border-radius:var(--radius-md);
  background:rgba(var(--color-brand-primary-rgb),.1);border:1px solid rgba(var(--color-brand-primary-rgb),.25);color:var(--color-brand-primary);
  font-size:var(--size-font-md);font-weight:700;font-family:var(--font);cursor:pointer;text-decoration:none;
  transition:.2s}
.btn-room:hover{background:rgba(var(--color-brand-primary-rgb),.2)}
/* New appointment button */
.fab{position:fixed;bottom:90px;left:20px;width:52px;height:52px;border-radius:var(--radius-circle);
  background:var(--color-brand-primary);color:var(--color-text-primary);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(var(--color-brand-primary-rgb),.4);
  transition:.2s}
.fab:hover{transform:scale(1.05)}
/* Empty / loading */
.empty{text-align:center;padding:60px var(--space-10);color:var(--ap-text-sub)}
.empty-icon{margin-bottom:var(--space-6);opacity:.5;display:flex;justify-content:center}
.empty-icon .tw-ico{width:48px;height:48px}
.empty-txt{font-size:var(--size-font-xl);margin-bottom:var(--space-3);color:var(--ap-text)}
.empty-sub{font-size:var(--size-font-md)}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--radius-sm)}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}
.sk-card{height:120px;margin-bottom:var(--space-6);border-radius:var(--r)}
</style>
</head>
<body>

<!-- Unified app header (HEADER-NAV.md — rendered by twMountAppChrome) -->
<header data-tw-header></header>
<h1 class="ap-title" data-tw-t="appt.title"></h1>

<div class="fbar" id="filterBar">
  <button class="ftab active" data-f="" data-tw-t="common.all"></button>
  <button class="ftab" data-f="pending_response" data-tw-t="appt.status.pending_response"></button>
  <button class="ftab" data-f="confirmed" data-tw-t="appt.status.confirmed"></button>
  <button class="ftab" data-f="reschedule_requested" data-tw-t="appt.status.reschedule_requested"></button>
  <button class="ftab" data-f="cancelled" data-tw-t="appt.status.cancelled"></button>
  <button class="ftab" data-f="completed" data-tw-t="appt.status.completed"></button>
</div>

<div class="content" id="apptList">
  <div class="skeleton sk-card"></div>
  <div class="skeleton sk-card"></div>
  <div class="skeleton sk-card"></div>
</div>

<!-- Company: New Appointment FAB -->

<!-- Unified bottom nav (HNAV-06) — appointments tab is current by path -->
<nav data-tw-bottom-nav></nav>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-schedule.js?v={{v:tw-schedule.js}}"></script>
<script>
(function(){
  'use strict';
  // Protected page guard (tw_shared.js) — TwAuthSync snapshot only; guest → /login?next=
  const _snap = twRequireAuth();
  if (!_snap) return;

  const IS_CO = _snap.userType === 'co';
  let _currentFilter = '';

  // All page text = Strings System keys (twT — SYSTEMS_INDEX §59); static markup via data-tw-t.
  document.title = twT('page.title', { page: twT('appt.title') });
  twTApply(document.body);

  // Status labels = twT('appt.status.<status>') · badge classes
  const STATUS_CLASS = {
    draft: 'badge-draft', pending_response: 'badge-pending',
    reschedule_requested: 'badge-reschedule', confirmed: 'badge-confirmed',
    cancelled: 'badge-cancelled', expired: 'badge-expired',
    missed: 'badge-missed', completed: 'badge-completed', closed: 'badge-closed'
  };

  // DOM
  const listEl = document.getElementById('apptList');

  twIcon.hydrate(document.body);   // static <i data-tw-icon> placeholders (DS-ICON)

  // + (new appointment) — Actions Registry `schedule_new` decides who sees it (BUTTONS.md BTN-19)
  const fabNew = twAction('schedule_new', { className: 'fab', iconOnly: true, iconSize: null,
    onClick: function(){ twScheduleInterview({}); } });
  if (fabNew) document.body.appendChild(fabNew);

  // Filter tabs
  document.getElementById('filterBar').addEventListener('click', function(e){
    const tab = e.target.closest('.ftab');
    if (!tab) return;
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    _currentFilter = tab.dataset.f || '';
    loadAppointments();
  });

  // API calls via twApi (tw_shared.js — API Client Rule): auth headers, JSON, timeout,
  // one result shape; 401 → TwAuthSync.invalidateSession → the page guard sends the visitor
  // to /login?next=. Error text via twApiMessage (FBK M15).

  function formatDate(iso){
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString('ar-JO', { dateStyle: 'medium', timeStyle: 'short' });
    } catch(e){ return iso; }
  }

  function metaItem(icon, text){
    const mi = document.createElement('div');
    mi.className = 'meta-item';
    mi.appendChild(twIconEl(icon, { size: 'sm' }));
    const span = document.createElement('span');
    safeText(span, text);
    mi.appendChild(span);
    return mi;
  }

  function stateBox(icon, title, sub){
    const box = document.createElement('div');
    box.className = 'empty';
    const ic = document.createElement('div');
    ic.className = 'empty-icon';
    ic.appendChild(twIconEl(icon));
    box.appendChild(ic);
    const t = document.createElement('div');
    t.className = 'empty-txt';
    safeText(t, title);
    box.appendChild(t);
    if (sub) {
      const s = document.createElement('div');
      s.className = 'empty-sub';
      safeText(s, sub);
      box.appendChild(s);
    }
    return box;
  }

  function renderCard(a){
    const s = a.computed_status || a.status;
    const cls = STATUS_CLASS[s] || 'badge-draft';
    const lbl = STATUS_CLASS[s] ? twT('appt.status.' + s) : s;

    const card = document.createElement('div');
    card.className = 'appt-card';
    card.addEventListener('click', function(){
      location.href = '/appointment-room?id=' + encodeURIComponent(a.id);
    });

    const displayName = IS_CO ? a.applicant_name : a.company_name;
    const jobTxt = a.job_title ? a.job_title : twT('appt.general_interview');

    const top = document.createElement('div');
    top.className = 'card-top';

    // DS-IMAGE: the other side — applicant (emp) for a company, company (co) otherwise
    const ava = twAvatarEl({ full_name: displayName, user_type: IS_CO ? 'emp' : 'co' }, 'lg');

    const info = document.createElement('div');
    info.className = 'card-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    safeText(nameEl, displayName);
    const jobEl = document.createElement('div');
    jobEl.className = 'card-job';
    safeText(jobEl, jobTxt);
    info.appendChild(nameEl);
    info.appendChild(jobEl);

    const badge = document.createElement('span');
    badge.className = 'badge ' + cls;
    safeText(badge, lbl);

    top.appendChild(ava);
    top.appendChild(info);
    top.appendChild(badge);
    card.appendChild(top);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    if (a.scheduled_at) meta.appendChild(metaItem('clock', formatDate(a.scheduled_at)));
    meta.appendChild(metaItem('calendar', a.mode === 'online' || a.mode === 'onsite' ? twT('appt.mode.' + a.mode) : a.mode));
    card.appendChild(meta);

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    const btnRoom = twAction('open_room', { href: '/appointment-room?id=' + encodeURIComponent(a.id),
      className: 'btn-room' });
    if (btnRoom) footer.appendChild(btnRoom);
    card.appendChild(footer);

    return card;
  }

  function loadAppointments(){
    listEl.innerHTML = '<div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>';
    const qs = _currentFilter ? '?status=' + encodeURIComponent(_currentFilter) : '';
    twApi('/api/appointments' + qs).then(res => {
      listEl.innerHTML = '';
      if (!res.ok) {
        listEl.appendChild(stateBox('alert', twT('common.load_error'),
          twApiMessage(res, twT('common.check_connection'))));
        return;
      }
      if (!Array.isArray(res.data) || res.data.length === 0) {
        listEl.appendChild(stateBox('calendar', twT('appt.empty'),
          twT(_currentFilter ? 'appt.empty_filtered' : 'appt.empty_none')));
        return;
      }
      res.data.forEach(a => listEl.appendChild(renderCard(a)));
    });
  }

  loadAppointments();
})();
</script>
</body>
</html>
