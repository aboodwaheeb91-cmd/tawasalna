<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<title>تواصلنا - ملف الشركة</title>
<link rel="stylesheet" href="/static/app-header.css">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/shared/tw-skeleton.css">
<link rel="stylesheet" href="/static/company/company.css">
</head>
<body class="co-loading">
<!--
╔══════════════════════════════════════════════╗
║  TAWASALNA - COMPANY-PROFILE                 ║
║  Architecture: Modular (static/company/)     ║
║  Visual: Profile V2 parity (PR 237)         ║
║  DO NOT add <script> or <style> blocks here  ║
╚══════════════════════════════════════════════╝
-->

<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<!-- Unified app header (HEADER-NAV.md — rendered by twMountAppChrome) -->
<header data-tw-header></header>

<!-- ██ SHELL ██ -->
<div class="sc-wrap">

<!-- ██ SKELETON (visible during co-loading, hidden after) ██ -->
<div class="co-skeleton" aria-hidden="true" role="presentation">
  <div class="co-sk-cover tw-skeleton"></div>
  <div class="co-sk-prof-row">
    <div class="co-sk-logo tw-skeleton"></div>
    <div class="co-sk-info">
      <div class="co-sk-name tw-skeleton"></div>
      <div class="co-sk-type tw-skeleton"></div>
      <div class="co-sk-desc tw-skeleton"></div>
      <div class="co-sk-desc co-sk-desc--short tw-skeleton"></div>
    </div>
  </div>
  <div class="co-sk-stats">
    <div class="co-sk-stat tw-skeleton"></div>
    <div class="co-sk-stat tw-skeleton"></div>
    <div class="co-sk-stat tw-skeleton"></div>
  </div>
  <div class="co-sk-section">
    <div class="co-sk-sec-header tw-skeleton"></div>
    <div class="co-sk-sec-lines">
      <div class="co-sk-sec-line tw-skeleton"></div>
      <div class="co-sk-sec-line co-sk-sec-line--short tw-skeleton"></div>
      <div class="co-sk-sec-line tw-skeleton"></div>
    </div>
  </div>
  <div class="co-sk-section">
    <div class="co-sk-sec-header tw-skeleton"></div>
    <div class="co-sk-sec-lines">
      <div class="co-sk-sec-line tw-skeleton"></div>
      <div class="co-sk-sec-line co-sk-sec-line--short tw-skeleton"></div>
    </div>
  </div>
</div>

<div id="coErrorState" class="co-error-state" role="alert" aria-live="polite">
  <span class="co-err-ico"><i data-tw-icon="wifi-off" data-tw-size="2xl"></i></span>
  <div class="co-err-title" id="coErrTitle" data-tw-t="company.error.title"></div>
  <div class="co-err-sub" id="coErrSub" data-tw-t="common.check_connection"></div>
  <button type="button" id="coRetryBtn" class="co-err-btn"><span data-tw-t="common.retry"></span></button>
</div>

<div class="sc-main-card">

<!-- ██ COVER ██ -->
<div class="sc-cover" id="heroSection">
  <img loading="lazy" id="coverImg" src="" alt="">
  <label id="coverUploadBtn" class="cv-edit-btn owner-only" data-tw-t-label="company.cover_change">
    <input id="coverFileInput" type="file" accept="image/*" class="file-input-hidden">
    <i data-tw-icon="camera" data-tw-size="sm"></i>
  </label>
</div>

<!-- ██ PROFILE ROW (logo + info, margin-top:-40px) ██ -->
<div class="sc-prof-row">

  <!-- Logo column -->
  <div class="sc-ava-col">
    <div class="sc-avatar-wrap">
      <div class="co-logo" id="coLogo"><i data-tw-icon="building-2" data-tw-size="xl"></i></div>
      <span class="co-logo-verify" id="coLogoBadge" data-tw-t-label="company.verified_aria">
        <i data-tw-icon="badge-check" data-tw-size="sm"></i>
      </span>
      <!-- Logo cam button — owner-only, matches Profile V2 .av-cam-btn -->
      <button class="av-cam-btn owner-only" id="coLogoCamBtn" data-tw-t-label="company.logo_change" type="button">
        <i data-tw-icon="camera" data-tw-size="sm"></i>
      </button>
      <input id="coLogoFileInput" type="file" accept="image/jpeg,image/png,image/webp" class="file-input-hidden">
    </div>
  </div>

  <!-- Company info column -->
  <div class="sc-info">
    <div class="co-name-row">
      <h1 class="co-name" id="coName"></h1>
      <span id="coVerifiedBadge" class="co-verified-badge">
        <i data-tw-icon="badge-check" data-tw-size="xs"></i> <span data-tw-t="company.verified"></span>
      </span>
    </div>
    <div class="co-type-badge" id="coTypeBadge"></div>
    <div class="co-desc" id="coDesc"></div>
    <div class="co-meta-row">
      <div class="co-meta-inline">
        <span id="coWebsite">
          <button type="button" class="co-copy-btn" id="coWebsiteCopyBtn" data-tw-t-label="company.copy_link"><i data-tw-icon="copy" data-tw-size="sm"></i></button>
          <a href="#" id="coWebsiteLink" class="co-meta-link" target="_blank" rel="noopener noreferrer"></a>
        </span>
      </div>
    </div>
    <div class="co-hq-row" id="coHqRow">
      <i data-tw-icon="map-pin" data-tw-size="sm"></i>
      <span class="co-hq-label" data-tw-t="company.hq_label"></span>
      <span id="coHqText"></span>
    </div>
    <div class="co-branches-row" id="coBranchesRow">
      <i data-tw-icon="git-branch" data-tw-size="sm"></i>
      <span class="co-branches-label" data-tw-t="company.branches_label"></span>
      <span id="coBranchesText"></span>
    </div>

  </div><!-- /sc-info -->

</div><!-- /sc-prof-row -->

<!-- ██ ACTIONS ██ -->
<!-- Owner: edit + communication hub (click handlers bound by id in the main module) -->
<div class="sc-actions owner-only" id="ownerActions">
  <button type="button" class="nb nb-outline" id="editInfoBtn">
    <i data-tw-icon="edit" data-tw-size="sm"></i> <span data-tw-t="company.edit_info"></span>
  </button>
  <button type="button" class="nb nb-outline" id="coHubBtn">
    <i data-tw-icon="calendar-clock" data-tw-size="sm"></i> <span data-tw-t="company.hub"></span>
  </button>
</div>
<!-- Visitor actions (follow / message / share / report) — twAction in company.render.js -->
<div class="sc-actions" id="visitorActions"></div>

<!-- ██ STATS ██ -->
<div class="sc-stats">
  <div class="sc-stat">
    <span class="sc-stat-i" style="color:var(--color-categorical-orange)"><i data-tw-icon="briefcase" data-tw-size="lg"></i></span>
    <div class="sc-stat-n" id="jobsCount">0</div>
    <div class="sc-stat-l" data-tw-t="company.stat.jobs"></div>
  </div>
  <div class="sc-stat">
    <span class="sc-stat-i" style="color:var(--color-categorical-teal)"><i data-tw-icon="file-text" data-tw-size="lg"></i></span>
    <div class="sc-stat-n" id="postsCount">0</div>
    <div class="sc-stat-l" data-tw-t="company.stat.posts"></div>
  </div>
  <div class="sc-stat">
    <span class="sc-stat-i" style="color:var(--color-categorical-blue)"><i data-tw-icon="eye" data-tw-size="lg"></i></span>
    <div class="sc-stat-n" id="viewsCount">0</div>
    <div class="sc-stat-l" data-tw-t="company.stat.views"></div>
  </div>
  <div class="sc-stat co-stat-clickable" id="coStatFollowersTile">
    <span class="sc-stat-i" style="color:var(--color-categorical-purple)"><i data-tw-icon="users" data-tw-size="lg"></i></span>
    <div class="sc-stat-n" id="followersCount">0</div>
    <div class="sc-stat-l" data-tw-t="company.stat.followers"></div>
  </div>
  <div class="sc-stat co-stat-clickable" id="coStatRatingTile">
    <span class="sc-stat-i" style="color:var(--color-categorical-gold)"><i data-tw-icon="star" data-tw-size="lg"></i></span>
    <div class="sc-stat-n" id="ratingAvg">—</div>
    <div class="sc-stat-l" data-tw-t="company.stat.rating"></div>
  </div>
</div>

<!-- ██ TABS ██ -->
<div class="sc-tabs-wrap">
  <div class="sc-tabs">
    <button type="button" class="sc-tab active" data-tab="jobs" data-tw-t="company.tab.jobs"></button>
    <button type="button" class="sc-tab" data-tab="posts" data-tw-t="company.tab.posts"></button>
    <button type="button" class="sc-tab" data-tab="about" data-tw-t="company.tab.about"></button>
  </div>
</div>

<!-- ██ CONTENT ██ -->
<div class="sc-content" id="main-content">

  <!-- JOBS TAB (default) -->
  <div id="tab-jobs">
    <div class="jobs-owner-toolbar owner-only">
      <button id="postJobBtn" class="nb nb-owner-action">
        <i data-tw-icon="add" data-tw-size="sm"></i> <span data-tw-t="company.post_job"></span>
      </button>
      <button id="candidatesBtn" class="nb nb-owner-action nb-talent-bank">
        <i data-tw-icon="gem" data-tw-size="sm"></i> <span data-tw-t="company.talent_bank"></span>
        <span class="co-cand-badge" id="candidatesBadge" style="display:none">0</span>
      </button>
    </div>

    <div id="jobsList"></div>

  </div><!-- /tab-jobs -->

  <!-- POSTS TAB -->
  <div id="tab-posts">
    <div class="owner-only posts-owner-bar">
      <button id="postModalBtn" class="nb nb-owner-action">
        <i data-tw-icon="send" data-tw-size="sm"></i> <span data-tw-t="company.new_post"></span>
      </button>
    </div>
    <div id="postsList"></div>
    <div id="postsEmpty" data-tw-t="company.posts_empty"></div>
  </div>

  <!-- ABOUT TAB -->
  <div id="tab-about">
    <div class="about-grid">

      <div class="about-card">
        <div class="ac-title" data-tw-t="company.tab.about"></div>
        <div id="aboutDesc" hidden></div>
        <div class="ac-item" id="aboutTypeRow" hidden><span class="ac-icon"><i data-tw-icon="building-2" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.type"></div><div class="ac-val" id="aboutType"></div></div></div>
        <div class="ac-item" id="aboutLocRow" hidden><span class="ac-icon"><i data-tw-icon="map-pin" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.location"></div><div class="ac-val" id="aboutLoc"></div></div></div>
        <div class="ac-item" id="aboutFoundedRow" hidden><span class="ac-icon"><i data-tw-icon="calendar" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.founded"></div><div class="ac-val" id="aboutFounded"></div></div></div>
        <div class="ac-item" id="aboutSizeRow" hidden><span class="ac-icon"><i data-tw-icon="users" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.size"></div><div class="ac-val" id="aboutSize"></div></div></div>
        <div class="ac-item" id="aboutWebRow" hidden><span class="ac-icon"><i data-tw-icon="globe" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.website"></div><div class="ac-val" id="aboutWeb"></div></div></div>
        <div class="ac-item" id="aboutEmailRow" hidden><span class="ac-icon"><i data-tw-icon="mail" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.email"></div><div class="ac-val" id="aboutEmail"></div></div></div>
        <div class="ac-item" id="aboutPhoneRow" hidden><span class="ac-icon"><i data-tw-icon="phone" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.phone"></div><div class="ac-val" id="aboutPhone"></div></div></div>
        <div class="tw-empty-sub" id="aboutEmpty" hidden data-tw-t="company.about.empty"></div>
      </div>

      <div>
        <div class="about-card" id="coAboutVerifiedRow" hidden>
          <div class="ac-title" data-tw-t="company.about.achievements"></div>
          <div class="ac-item"><span class="ac-icon"><i data-tw-icon="shield-check" data-tw-size="sm"></i></span><div><div class="ac-key" data-tw-t="company.about.verification"></div><div class="ac-val" data-tw-t="company.about.verified_by"></div></div></div>
        </div>

        <div class="followers-wrap">
          <div class="ac-title" data-tw-t="company.stat.followers"></div>
          <div class="fw-count"><span id="followersCount2">0</span> <span data-tw-t="company.followers_unit"></span></div>
        </div>

        <div class="rating-card">
          <div class="ac-title" data-tw-t="company.rating.card_title"></div>
          <div class="stars" id="ratingStarsDisplay"></div>
          <div class="rating-nums">
            <div class="rating-n" id="ratingNum">—</div>
            <div class="rating-sub" id="ratingSub" data-tw-t="company.rating.none"></div>
          </div>
          <div class="rate-interactive visitor-only" id="rateBox">
            <div id="ratePrompt" data-tw-t="company.rating.prompt"></div>
            <div class="rate-stars" id="rateStars">
              <span data-score="1"><i data-tw-icon="star" data-tw-size="2xl"></i></span><span data-score="2"><i data-tw-icon="star" data-tw-size="2xl"></i></span><span data-score="3"><i data-tw-icon="star" data-tw-size="2xl"></i></span><span data-score="4"><i data-tw-icon="star" data-tw-size="2xl"></i></span><span data-score="5"><i data-tw-icon="star" data-tw-size="2xl"></i></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div><!-- /tab-about -->


</div><!-- /sc-content -->

</div><!-- /sc-main-card -->
</div><!-- /sc-wrap -->

<!-- ██ EDIT MODAL ██ -->
<div class="overlay edit-overlay" id="editOverlay">
  <div class="modal co-edit-sheet">
    <div class="modal-head">
      <span class="modal-head-title">
        <span style="color:var(--color-brand-primary);vertical-align:middle;margin-left:6px"><i data-tw-icon="edit" data-tw-size="sm"></i></span>
        <span data-tw-t="company.edit.title"></span>
      </span>
      <button type="button" class="modal-head-close" data-tw-t-label="common.close">
        <i data-tw-icon="close" data-tw-size="sm"></i>
      </button>
    </div>
    <div class="modal-scroll-body">

    <div class="mf-section-title" data-tw-t="company.edit.section.basic"></div>
    <div class="mf"><label data-tw-t="company.edit.name"></label><input id="e-name" data-tw-t-placeholder="company.edit.name_ph"></div>
    <div class="mf"><label data-tw-t="company.edit.desc"></label><textarea id="e-desc" data-tw-t-placeholder="company.edit.desc_ph"></textarea></div>
    <div class="mrow-3">
      <div class="mf"><label><span data-tw-t="company.edit.type"></span> <span class="req-star">*</span></label>
        <select id="e-type" class="ep-select" required>
          <option value="" disabled selected data-tw-t="company.edit.type_pick"></option>
        </select>
      </div>
      <div class="mf"><label data-tw-t="company.edit.founded"></label>
        <select id="e-founded" class="ep-select">
          <option value="" data-tw-t="company.edit.founded_pick"></option>
        </select>
      </div>
      <div class="mf"><label data-tw-t="company.edit.size"></label>
        <select id="e-size" class="ep-select">
          <option value="" data-tw-t="common.pick"></option>
        </select>
      </div>
    </div>

    <div class="mf-section-title" data-tw-t="company.edit.section.location"></div>
    <div class="mrow-3">
      <div class="mf"><label data-tw-t="form.country"></label>
        <select id="e-country" class="ep-select">
          <option value="" data-tw-t="form.country_pick"></option>
        </select>
      </div>
      <div class="mf"><label data-tw-t="company.edit.city"></label>
        <select id="e-city-sel" class="ep-select">
          <option value="" data-tw-t="form.city_pick"></option>
        </select>
      </div>
      <div class="mf">
        <label data-tw-t="company.edit.district"></label>
        <input id="e-district" data-tw-t-placeholder="company.edit.district_ph">
      </div>
    </div>

    <div class="mf-section-title" data-tw-t="company.edit.section.branches"></div>
    <div id="branchesList"></div>
    <button type="button" id="addBranchBtn" class="mbtn-add-branch" data-tw-t="company.edit.add_branch"></button>
    </div><!-- /modal-scroll-body -->
    <div class="modal-foot">
      <button id="editSaveBtn" class="mbtn mbtn-ok" data-tw-t="common.save_changes"></button>
      <button id="editCancelBtn" class="mbtn mbtn-no" data-tw-t="common.cancel"></button>
    </div>
  </div>
</div>

<!-- ██ COMMUNICATION HUB (owner-only) ██ -->
<div class="co-hub-overlay" id="coHubOverlay">
  <div class="co-hub-sheet">
    <div class="co-hub-head">
      <span class="co-hub-title">
        <span style="color:var(--color-brand-secondary);vertical-align:middle;margin-left:6px"><i data-tw-icon="messages-square" data-tw-size="sm"></i></span>
        <span data-tw-t="company.hub"></span>
      </span>
      <button class="modal-head-close" id="coHubCloseBtn" data-tw-t-label="common.close">
        <i data-tw-icon="close" data-tw-size="sm"></i>
      </button>
    </div>
    <div class="co-hub-tabs">
      <button class="co-hub-tab active" data-hub-tab="messages">
        <i data-tw-icon="message-circle" data-tw-size="sm"></i> <span data-tw-t="company.hub_tab.messages"></span>
      </button>
      <button class="co-hub-tab" data-hub-tab="appointments">
        <i data-tw-icon="calendar" data-tw-size="sm"></i> <span data-tw-t="company.hub_tab.appointments"></span>
      </button>
    </div>
    <div class="co-hub-body">
      <div class="co-hub-panel" id="coHubMsgPanel">
        <a href="/messages" class="co-hub-nav-card">
          <div class="co-hub-nav-ico"><i data-tw-icon="messages" data-tw-size="lg"></i></div>
          <div class="co-hub-nav-info">
            <div class="co-hub-nav-title" data-tw-t="company.hub_inbox"></div>
            <div class="co-hub-nav-sub" data-tw-t="company.hub_inbox_sub"></div>
          </div>
          <span class="co-hub-go-ico"><i data-tw-icon="forward" data-tw-size="sm"></i></span>
        </a>
      </div>
      <div class="co-hub-panel" id="coHubApptPanel" style="display:none">
        <div id="coHubApptList"><div class="co-hub-appt-loading" data-tw-t="common.loading"></div></div>
        <div class="co-hub-appt-footer">
          <a href="/appointments" class="nb nb-outline" style="width:100%;justify-content:center" data-tw-t="company.hub_appts_all"></a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ██ POST JOB MODAL ██ -->
<div class="overlay edit-overlay" id="postJobOverlay">
  <div class="modal co-edit-sheet">
    <div class="modal-head">
      <span class="modal-head-title" data-tw-t="company.job_form.title"></span>
      <button class="modal-head-close" id="postJobCancelBtn" data-tw-t-label="common.close"><i data-tw-icon="close"></i></button>
    </div>
    <div class="modal-scroll-body">
      <div class="mf"><label data-tw-t="company.job_form.job_title"></label><input id="j-title" data-tw-t-placeholder="company.job_form.job_title_ph"></div>
      <div class="mf"><label data-tw-t="company.job_form.prof"></label><select id="j-prof" class="j-prof-sel ep-select"><option value="" data-tw-t="company.job_form.prof_loading"></option></select></div>

      <div class="mf j-acc-all-wrap">
        <label class="j-toggle-label">
          <input type="checkbox" id="j-acc-all">
          <span class="j-toggle-ico"><i data-tw-icon="users" data-tw-size="sm"></i></span>
          <span data-tw-t="company.job_form.accept_all"></span>
        </label>
      </div>

      <div class="mf" id="j-acc-prof-section">
        <label data-tw-t="company.job_form.extra_profs"></label>
        <div class="j-skill-box-wrap">
          <div class="j-skill-box" id="j-acc-prof-box">
            <div class="j-skill-chips" id="j-acc-prof-chips"></div>
            <input id="j-acc-prof-inp" class="j-skill-inp" data-tw-t-placeholder="company.job_form.extra_profs_ph" autocomplete="off" maxlength="60">
          </div>
          <div class="j-skill-drop" id="j-acc-prof-drop" style="display:none"></div>
        </div>
      </div>

      <div class="mrow">
        <div class="mf"><label data-tw-t="company.job_form.type"></label><select id="j-type" class="ep-select"></select></div>
        <div class="mf"><label data-tw-t="company.job_form.wmode"></label><select id="j-wmode" class="ep-select"></select></div>
      </div>
      <div class="mf"><label data-tw-t="company.job_form.exp"></label><select id="j-exp" class="ep-select"></select></div>

      <div class="mf"><label data-tw-t="company.job_form.duration"></label>
        <select id="j-dur" class="ep-select">
          <option value="3" data-tw-t="company.job_form.dur.3"></option>
          <option value="7" selected data-tw-t="company.job_form.dur.7"></option>
          <option value="14" data-tw-t="company.job_form.dur.14"></option>
          <option value="30" data-tw-t="company.job_form.dur.30"></option>
        </select>
      </div>

      <div class="mf">
        <label data-tw-t="company.job_form.location"></label>
        <select id="j-loc-mode" class="ep-select">
          <option value="hq" data-tw-t="company.job_form.loc.hq"></option>
          <option value="remote" data-tw-t="company.job_form.loc.remote"></option>
          <option value="branch" data-tw-t="company.job_form.loc.branch"></option>
          <option value="custom" data-tw-t="company.job_form.loc.custom"></option>
        </select>
      </div>
      <div class="mf" id="j-branch-wrap" style="display:none"><label data-tw-t="company.job_form.branch"></label><select id="j-branch-sel" class="ep-select"></select></div>
      <div id="j-custom-wrap" style="display:none">
        <div class="mf"><label data-tw-t="form.country"></label><select id="j-loc-country" class="ep-select"><option value="" data-tw-t="form.country_pick"></option></select></div>
        <div class="mf"><label data-tw-t="form.city"></label><select id="j-loc-city" class="ep-select"><option value="" data-tw-t="form.city_pick"></option></select></div>
      </div>

      <div class="mf j-sal-toggle-wrap">
        <label class="j-toggle-label">
          <input type="checkbox" id="j-sal-show">
          <span data-tw-t="company.job_form.show_salary"></span>
        </label>
      </div>
      <div id="j-sal-row" style="display:none">
        <div class="mrow">
