<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head:admin-->
<!-- Admin — unified settings (task 4.1 · docs/rules/settings.md · SYSTEMS_INDEX §25g).
     Route: the admin panel path + /settings (server.py → admin_settings_page) · data: GET /admin/settings ·
     PUT /admin/settings/{key} · POST /admin/settings/{key}/reset via TwAdminShell.run (confirm first).
     Header + menu + session gate: Admin Shell (task 5.3a · docs/rules/admin-shell.md). -->
<link rel="stylesheet" href="/static/shared/admin-shell.css?v={{v:admin-shell.css}}">
<title></title>
<style>
.as-title { display: flex; align-items: center; gap: var(--space-3); font-size: var(--size-font-md); font-weight: 900; margin: 0 0 var(--space-5); }
.as-title svg { color: var(--color-brand-primary); }
.as-item { display: grid; gap: var(--space-2); padding: var(--space-5) 0; border-bottom: 1px solid var(--color-border-subtle); }
.as-item:last-child { border-bottom: 0; }
.as-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.as-label { flex: 1; min-width: 0; font-size: var(--size-font-sm); font-weight: 800; color: var(--color-text-primary); }
.as-desc, .as-range { margin: 0; font-size: var(--size-font-xs); color: var(--color-text-muted); line-height: 1.8; }
.as-restart { margin: 0; font-size: var(--size-font-xs); color: var(--color-status-warning); font-weight: 700; }
.as-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.as-row .tw-input { width: 140px; max-width: 100%; direction: ltr; text-align: left; }
</style>
</head>
<body class="tw-adm-body-page">
<header data-tw-header="admin" hidden></header>

<main class="tw-adm-main" id="main-content">
  <h1 class="as-title"><i data-tw-icon="settings-2"></i><span data-tw-t="admin.settings.title"></span></h1>
  <div id="asRoot" aria-live="polite"><p class="tw-adm-msg" data-tw-t="common.loading"></p></div>
</main>

<!--tw:strings-->
<!--tw:shell-scripts:admin-->
<script src="/static/shared/admin-session.js"></script>
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/admin-sections.js?v={{v:admin-sections.js}}"></script>
<script src="/static/shared/admin-shell.js?v={{v:admin-shell.js}}"></script>
<script src="/static/admin-settings/admin-settings.js?v={{v:admin-settings.js}}"></script>
</body>
</html>
