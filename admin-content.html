<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head:admin-->
<!-- Admin — content screens (phase 5b · docs/rules/content-admin.md · SYSTEMS_INDEX §25h).
     Route: the admin panel path + /content (server.py → admin_content_page) · three tabs:
     strings (GET / PUT /admin/strings) · colors (GET / PUT /admin/theme/colors) · news (/admin/news).
     Permission content.edit — 403 → "no permission" message, session kept (same as /settings).
     Header + menu + session gate + every write: Admin Shell (docs/rules/admin-shell.md). -->
<link rel="stylesheet" href="/static/shared/admin-shell.css?v={{v:admin-shell.css}}">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<title></title>
<style>
.ac-title { display: flex; align-items: center; gap: var(--space-3); font-size: var(--size-font-md); font-weight: 900; margin: 0 0 var(--space-5); }
.ac-title svg { color: var(--color-brand-primary); }
.ac-tabs { display: flex; flex-wrap: wrap; gap: var(--space-3); margin: 0 0 var(--space-5); }
.ac-tabs [aria-selected="true"] { border-color: var(--color-brand-primary); color: var(--color-brand-primary); }
.ac-search { width: 100%; max-width: 420px; margin: 0 0 var(--space-3); }
.ac-meta, .ac-def, .ac-note { margin: 0; font-size: var(--size-font-xs); color: var(--color-text-muted); line-height: 1.8; }
.ac-item { display: grid; gap: var(--space-2); padding: var(--space-5) 0; border-bottom: 1px solid var(--color-border-subtle); }
.ac-item:last-child { border-bottom: 0; }
.ac-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.ac-key { flex: 1; min-width: 0; direction: ltr; text-align: left; font-size: var(--size-font-xs); font-weight: 800; color: var(--color-text-primary); overflow-wrap: anywhere; }
.ac-item .tw-input { width: 100%; }
.ac-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.ac-hex { width: 120px; direction: ltr; text-align: left; }
.ac-pick { width: var(--size-control-md); height: var(--size-control-md); padding: 0; border: 1px solid var(--color-border-default); border-radius: var(--radius-control); background: transparent; cursor: pointer; }
.ac-pv { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-5); padding: var(--space-4); border-radius: var(--radius-control); background: var(--color-surface-page); border: 1px solid var(--color-border-subtle); }
.ac-pv-btn { min-height: var(--size-control-sm); padding: 0 var(--space-6); border: 0; border-radius: var(--radius-control); background: var(--pv); color: var(--pv-on); font: inherit; font-size: var(--size-font-sm); font-weight: 800; }
.ac-pv-link { color: var(--pv); font-size: var(--size-font-sm); font-weight: 700; text-decoration: underline; }
.ac-pv-badge { padding: var(--space-1) var(--space-4); border-radius: var(--radius-pill); border: 1px solid var(--pv); color: var(--pv); font-size: var(--size-font-xs); font-weight: 800; }
.ac-warn { margin: 0; font-size: var(--size-font-xs); font-weight: 700; color: var(--color-status-warning); }
.ac-block { margin: 0; font-size: var(--size-font-xs); font-weight: 700; color: var(--color-status-danger); }
.ac-table-wrap { overflow-x: auto; }
.ac-table { width: 100%; border-collapse: collapse; font-size: var(--size-font-sm); }
.ac-table th, .ac-table td { padding: var(--space-3); text-align: start; border-bottom: 1px solid var(--color-border-subtle); vertical-align: middle; }
.ac-table th { font-size: var(--size-font-xs); color: var(--color-text-muted); font-weight: 800; }
.ac-acts { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.ac-form { display: grid; gap: var(--space-5); }
.ac-form label, .ac-f { display: grid; gap: var(--space-2); font-size: var(--size-font-xs); font-weight: 700; color: var(--color-text-secondary); }
.ac-err { margin: 0; font-size: var(--size-font-sm); color: var(--color-status-danger); }
.ac-err:empty { display: none; }
</style>
</head>
<body class="tw-adm-body-page">
<header data-tw-header="admin" hidden></header>

<main class="tw-adm-main" id="main-content">
  <h1 class="ac-title"><i data-tw-icon="file-text"></i><span data-tw-t="admin.content.title"></span></h1>
  <div id="acRoot" aria-live="polite"><p class="tw-adm-msg" data-tw-t="common.loading"></p></div>
</main>

<!--tw:strings-->
<!--tw:shell-scripts:admin-->
<script src="/static/shared/admin-session.js"></script>
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-schedule.js?v={{v:tw-schedule.js}}"></script>
<script src="/static/shared/admin-sections.js?v={{v:admin-sections.js}}"></script>
<script src="/static/shared/admin-shell.js?v={{v:admin-shell.js}}"></script>
<script src="/static/admin-content/admin-content.js?v={{v:admin-content.js}}"></script>
</body>
</html>
