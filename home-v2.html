<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<meta name="tw-page" content="auth">
<title></title>
<link rel="stylesheet" href="/static/app-header.css">
<link rel="stylesheet" href="/static/home-v2.css">
</head>
<body>

<!-- Unified app header (HEADER-NAV.md — rendered by twMountAppChrome) -->
<header data-tw-header></header>

<!-- Shell — Profile V2 card geometry wraps filters + feed -->
<div class="hw-shell">

<!-- Filter Bar (data-filter values = GET /home/feed allowlist — never translated) -->
<div class="hw-fbar">
  <div class="hw-fbar-inner">
    <button class="hw-ft active" data-filter="all" data-tw-t="common.all"></button>
    <button class="hw-ft" data-filter="opportunities" data-tw-t="jobs.title"></button>
    <button class="hw-ft" data-filter="posts" data-tw-t="home.filter.posts"></button>
    <button class="hw-ft" data-filter="news" data-tw-t="home.filter.news"></button>
  </div>
</div>

<!-- Page -->
<div class="hw-page">

  <!-- FEED -->
  <main class="hw-feed">

    <!-- Type banner — co/edu only -->
    <div id="hwBanner" class="hw-banner hidden">
      <div class="hw-banner-ico" id="hwBIco"></div>
      <div class="hw-banner-info">
        <h3 id="hwBTitle"></h3>
        <p id="hwBSub"></p>
      </div>
      <div class="hw-banner-stats hidden" id="hwBStats"></div>
    </div>

    <!-- Feed list (populated by Home.render via static/home/ modules) -->
    <div id="hwFeed"></div>

    <!-- Empty state -->
    <div id="hwEmpty" class="hw-empty hidden">
      <div class="hw-state-ico"><i data-tw-icon="rss" data-tw-size="xl"></i></div>
      <h3></h3>
      <p></p>
    </div>

    <!-- Error state -->
    <div id="hwError" class="hw-error hidden">
      <div class="hw-state-ico"><i data-tw-icon="wifi-off" data-tw-size="xl"></i></div>
      <h3 data-tw-t="home.error_title"></h3>
      <p data-tw-t="common.check_connection"></p>
      <button class="hw-retry">
        <i data-tw-icon="refresh" data-tw-size="sm"></i>
        <span data-tw-t="home.retry"></span>
      </button>
    </div>

  </main>

  <!-- SIDEBAR (desktop only) -->
  <aside class="hw-sidebar">

    <!-- Profile completion — emp only, % from GET /profile/{id}/score (shown once it loads) -->
    <div class="hw-sb-box hidden" id="sbComplBox">
      <div class="hw-sb-hdr" data-tw-t="home.completion.title"></div>
      <div class="hw-compl-bar"><div class="hw-compl-fill" id="sbFill"></div></div>
      <div class="hw-compl-row">
        <span data-tw-t="home.completion.label"></span>
        <span id="sbPct"></span>
      </div>
      <a id="sbComplLink" class="hw-compl-link">
        <i data-tw-icon="forward" data-tw-size="xs"></i>
        <span data-tw-t="home.completion.improve"></span>
      </a>
    </div>

    <div class="hw-sb-box">
      <div class="hw-sb-hdr" data-tw-t="home.quick_links"></div>
      <div id="sbLinks"></div>
    </div>

  </aside>

</div><!-- .hw-page -->

</div><!-- .hw-shell -->

<!-- Unified bottom nav (HEADER-NAV.md HNAV-06) -->
<nav data-tw-bottom-nav></nav>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/home/home.utils.js"></script>
<script src="/static/home/home.state.js"></script>
<script src="/static/home/home.api.js"></script>
<script src="/static/home/home.cards.js"></script>
<script src="/static/home/home.render.js"></script>
<script src="/static/home/home.filters.js"></script>
<script src="/static/home/home.nav.js"></script>
<script src="/static/home/home.main.js"></script>
</body>
</html>
