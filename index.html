<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<link rel="dns-prefetch" href="https://tawasolna.com">
<title>تسجيل الدخول - تواصلنا</title>
<meta name="description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
<meta property="og:title" content="تسجيل الدخول - تواصلنا">
<meta property="og:description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tawasolna.com">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="تسجيل الدخول - تواصلنا">
<meta name="twitter:description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tawasolna.com">
<link rel="stylesheet" href="/static/index.css?v=auth-gw-v9">
</head>
<body>
<a href="#main-content" class="skip-link" data-tw-t="common.skip_to_content"></a>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="grid"></div>

<!-- Auth Gateway: no unified app header (HEADER-NAV.md — entry pages are out of scope) -->
<main id="main-content" class="wrap">

  <!-- Logo — approved file: 33333.svg, centered, 130-160px wide -->
  <div class="logo">
    <img src="/static/33333.svg" alt="تواصلنا" class="logo-img">
    <div class="logo-sub" data-tw-t="login.tagline"></div>
  </div>

  <!--
    Register step 1: account type = a real radio group (keyboard: Tab into the group, arrows move).
    Hidden by default; shown by showRegister(), hidden by showLogin().
    Cards stay visible after selection; #registerPanel accordion opens below.
    Hash routes: /login#register-emp, /login#register-co, /login#register-edu
  -->
  <div id="registerStep1" class="hidden">
    <div class="reg-step-header">
      <div class="reg-step-title" id="typeRowTitle" data-tw-t="register.pick_type"></div>
      <div class="reg-step-sub" data-tw-t="register.pick_type_sub"></div>
    </div>
    <div class="type-row" id="typeRow" role="radiogroup" aria-labelledby="typeRowTitle">
      <label class="type-btn" id="empBtn">
        <input type="radio" name="accountType" value="emp" class="type-radio">
        <span class="tb-ico"><i data-tw-icon="id-card" data-tw-size="lg"></i></span>
        <span class="tb-name" data-tw-t="account.type.emp"></span>
        <span class="tb-sub" data-tw-t="register.type_emp_sub"></span>
      </label>
      <label class="type-btn" id="coBtn">
        <input type="radio" name="accountType" value="co" class="type-radio">
        <span class="tb-ico"><i data-tw-icon="briefcase-business" data-tw-size="lg"></i></span>
        <span class="tb-name" data-tw-t="account.type.co"></span>
        <span class="tb-sub" data-tw-t="register.type_co_sub"></span>
      </label>
      <label class="type-btn" id="eduBtn">
        <input type="radio" name="accountType" value="edu" class="type-radio">
        <span class="tb-ico"><i data-tw-icon="graduation-cap" data-tw-size="lg"></i></span>
        <span class="tb-name" data-tw-t="account.type.edu"></span>
        <span class="tb-sub" data-tw-t="register.type_edu_sub"></span>
      </label>
    </div>
    <div class="switch-link" id="regBackStep1"><span data-tw-t="login.have_account"></span> <button type="button" class="link-btn" data-auth-go="login" data-tw-t="login.submit"></button></div>
  </div>

  <!-- Auth card (login only — OR divider and Google stay with login flow) -->
  <div class="bubble" id="loginBubble">
    <div id="loginSection">
      <div class="form-title" data-tw-t="login.title"></div>

      <!-- DS-VAL VAL-09: auth failure banner (form-level, not field-level) -->
      <div id="l-form-error" class="l-form-error" role="alert" aria-live="assertive" hidden>
        <span class="l-form-error-text"></span>
      </div>

      <!-- DS-INP: email field -->
      <div class="field" id="wrapper-lEmail">
        <label for="lEmail" data-tw-t="login.email"></label>
        <div class="l-input-wrap">
          <input id="lEmail" autocomplete="email" type="email" placeholder="example@email.com"
                 dir="ltr"
                 spellcheck="false"
                 required
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="l-email-error">
        </div>
        <span id="l-email-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: password field with show/hide toggle (INP-11) -->
      <div class="field" id="wrapper-lPass">
        <label for="lPass" data-tw-t="login.password"></label>
        <div class="l-input-wrap pass-wrap">
          <input id="lPass" autocomplete="current-password" type="password" placeholder="••••••••"
                 required
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="l-pass-error">
          <button type="button" id="lPassEye" class="pass-eye" data-pass-eye="lPass"
                  data-tw-t-label="login.show_password" aria-pressed="false"><i data-tw-icon="eye" data-tw-size="md"></i></button>
        </div>
        <span id="l-pass-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <div class="forgot-wrap">
        <button type="button" class="forgot-link link-btn" id="forgotBtn" data-tw-t="login.forgot"></button>
      </div>
      <button type="button" class="cta" id="loginBtn" data-tw-t="login.submit"></button>
      <div class="switch-link"><span data-tw-t="login.new_user"></span> <button type="button" class="link-btn" data-auth-go="register" data-tw-t="login.register_now"></button></div>
      <div class="or-divider">
        <div class="or-line"></div>
        <span class="or-text" data-tw-t="login.or"></span>
        <div class="or-line"></div>
      </div>
      <button type="button" class="google-btn" id="googleBtn">
        <i data-tw-icon="globe" data-tw-size="md"></i><span data-tw-t="login.google"></span>
      </button>
    </div>
  </div>

  <!--
    Register panel: accordion, starts collapsed.
    Opened by selectType() after user picks a role in step 1.
    Closed by showLogin() or when switching types (close → update → reopen).
  -->
  <div id="registerPanel" class="reg-panel">
    <div class="bubble">
      <div class="form-title" data-tw-t="register.title"></div>

      <!-- DS-VAL VAL-09: register failure banner (server / network — form-level) -->
      <div id="r-form-error" class="l-form-error" role="alert" aria-live="assertive" hidden>
        <span class="l-form-error-text"></span>
      </div>

      <!-- DS-INP: personal account structured name (3 fields, emp type only) -->
      <div id="empNameFields">
        <div class="field" id="wrapper-rFirstName">
          <label for="rFirstName" data-tw-t="register.first_name"></label>
          <div class="l-input-wrap">
            <input id="rFirstName" type="text" autocomplete="given-name" data-tw-t-placeholder="register.first_name"
                   aria-required="true"
                   aria-invalid="false"
                   aria-describedby="r-first-name-error">
          </div>
          <span id="r-first-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
        </div>
        <div class="field" id="wrapper-rMiddleName">
          <label for="rMiddleName"><span data-tw-t="register.middle_name"></span> <span class="optional-tag" data-tw-t="register.optional"></span></label>
          <div class="l-input-wrap">
            <input id="rMiddleName" type="text" autocomplete="additional-name" data-tw-t-placeholder="register.middle_placeholder"
                   aria-required="false"
                   aria-invalid="false">
          </div>
        </div>
        <div class="field" id="wrapper-rLastName">
          <label for="rLastName" data-tw-t="register.last_name"></label>
          <div class="l-input-wrap">
            <input id="rLastName" type="text" autocomplete="family-name" data-tw-t-placeholder="register.last_name"
                   aria-required="true"
                   aria-invalid="false"
                   aria-describedby="r-last-name-error">
          </div>
          <span id="r-last-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
        </div>
      </div>

      <!-- DS-INP: Org name field (co/edu type only) -->
      <div class="field" id="wrapper-rName" hidden>
        <label id="nameLabel" for="rName" data-tw-t="register.name_full"></label>
        <div class="l-input-wrap">
          <input id="rName" type="text" autocomplete="organization" data-tw-t-placeholder="register.name_placeholder"
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-name-error">
        </div>
        <span id="r-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: email field (INP-09: dir=ltr for email) -->
      <div class="field" id="wrapper-rEmail">
        <label for="rEmail" data-tw-t="login.email"></label>
        <div class="l-input-wrap">
          <input id="rEmail" type="email" autocomplete="email" placeholder="example@email.com"
                 dir="ltr"
                 spellcheck="false"
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-email-error">
        </div>
        <span id="r-email-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: password field with show/hide toggle (INP-11) -->
      <div class="field" id="wrapper-rPass">
        <label for="rPass" data-tw-t="login.password"></label>
        <div class="l-input-wrap pass-wrap">
          <input id="rPass" type="password" autocomplete="new-password"
                 data-tw-t-placeholder="register.pass_placeholder"
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-pass-error">
          <button type="button" id="rPassEye" class="pass-eye" data-pass-eye="rPass"
                  data-tw-t-label="login.show_password" aria-pressed="false"><i data-tw-icon="eye" data-tw-size="md"></i></button>
        </div>
        <span id="r-pass-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <div id="passStrengthBar">
        <div id="passStrengthFill"></div>
      </div>
      <div id="passStrengthLabel"></div>
      <button class="cta" type="button" id="regBtn" aria-busy="false" data-tw-t="auth.register"></button>
      <div class="switch-link hidden" id="regBackPanel"><span data-tw-t="login.have_account"></span> <button type="button" class="link-btn" data-auth-go="login" data-tw-t="login.submit"></button></div>
    </div>
  </div>

</main>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/index.auth.js?v=auth-gw-v13"></script>
<script src="/static/index.ui.js?v=auth-gw-v10"></script>
</body>
</html>
