<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html">
<head>
<meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://tawasolna.com">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00c896">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تواصلنا">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - تواصلنا</title>
  <meta name="description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
  <meta property="og:title" content="تسجيل الدخول - تواصلنا">
  <meta property="og:description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tawasolna.com">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="تسجيل الدخول - تواصلنا">
  <meta name="twitter:description" content="سجّل دخولك أو أنشئ حسابك في تواصلنا - منصة التوظيف والتوثيق العربية.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://tawasolna.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tw_shared.css">
<link rel="stylesheet" href="/static/index.css?v=auth-gw-v8">
</head>
<body>
<a href="#main-content" class="skip-link">تخطى للمحتوى الرئيسي</a>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="grid"></div>

<main id="main-content" class="wrap">

  <!-- Logo — approved file: 33333.svg, centered, 130-160px wide -->
  <div class="logo">
    <img src="/static/33333.svg" alt="تواصلنا" class="logo-img">
    <div class="logo-sub">منصة التوظيف والتوثيق العربية</div>
  </div>

  <!--
    Register step 1: role selection.
    Hidden by default; shown by showRegister(), hidden by showLogin().
    Cards stay visible after selection; #registerPanel accordion opens below.
    Hash routes: /login#register-emp, /login#register-co, /login#register-edu
  -->
  <div id="registerStep1" class="hidden">
    <div class="reg-step-header">
      <div class="reg-step-title">اختر نوع حسابك</div>
      <div class="reg-step-sub">حدد هل تريد التسجيل كموظف، شركة، أو مؤسسة تعليمية</div>
    </div>
    <div class="type-row" id="typeRow">
      <div class="type-btn" id="empBtn" onclick="selectType('emp')">
        <div class="tb-ico"><i data-lucide="id-card"></i></div>
        <div class="tb-name">موظف</div>
        <div class="tb-sub">باحث عن عمل</div>
      </div>
      <div class="type-btn" id="coBtn" onclick="selectType('co')">
        <div class="tb-ico"><i data-lucide="briefcase-business"></i></div>
        <div class="tb-name">شركة</div>
        <div class="tb-sub">صاحب عمل</div>
      </div>
      <div class="type-btn" id="eduBtn" onclick="selectType('edu')">
        <div class="tb-ico"><i data-lucide="graduation-cap"></i></div>
        <div class="tb-name">مؤسسة تعليمية</div>
        <div class="tb-sub">جامعة · مركز تدريب</div>
      </div>
    </div>
    <div class="switch-link" id="regBackStep1">عندك حساب؟ <span onclick="showLogin()">دخول</span></div>
  </div>

  <!-- Auth card (login only — OR divider and Google stay with login flow) -->
  <div class="bubble" id="loginBubble">
    <div id="loginSection">
      <div class="form-title">دخول</div>

      <!-- DS-VAL VAL-09: auth failure banner (form-level, not field-level) -->
      <div id="l-form-error" class="l-form-error" role="alert" aria-live="assertive" hidden>
        <span class="l-form-error-text"></span>
      </div>

      <!-- DS-INP: email field -->
      <div class="field" id="wrapper-lEmail">
        <label for="lEmail">البريد الإلكتروني</label>
        <div class="l-input-wrap">
          <input id="lEmail" autocomplete="email" type="email" placeholder="example@email.com"
                 dir="ltr"
                 spellcheck="false"
                 required
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="l-email-error">
        </div>
        <span id="l-email-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: password field with show/hide toggle (INP-11) -->
      <div class="field" id="wrapper-lPass">
        <label for="lPass">كلمة المرور</label>
        <div class="l-input-wrap pass-wrap">
          <input id="lPass" autocomplete="current-password" type="password" placeholder="••••••••"
                 required
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="l-pass-error">
          <button type="button" id="lPassEye" class="pass-eye"
                  aria-label="إظهار كلمة المرور"
                  aria-pressed="false">
            <svg id="lEyeShow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg id="lEyeHide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
          </button>
        </div>
        <span id="l-pass-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <div class="forgot-wrap">
        <span class="forgot-link">نسيت كلمة المرور؟</span>
      </div>
      <button class="cta" id="loginBtn" onclick="doLogin()">دخول</button>
      <div class="switch-link">مستخدم جديد؟ <span onclick="showRegister()">سجّل الآن</span></div>
      <div class="or-divider">
        <div class="or-line"></div>
        <span class="or-text">أو</span>
        <div class="or-line"></div>
      </div>
      <button class="google-btn" onclick="showToast('قريباً - تسجيل بـ Google','info')">
        🌐 متابعة بـ Google
      </button>
    </div>
  </div>

  <!--
    Register panel: accordion, starts collapsed.
    Opened by selectType() after user picks a role in step 1.
    Closed by showLogin() or when switching types (close → update → reopen).
  -->
  <div id="registerPanel" class="reg-panel">
    <div class="bubble">
      <div class="form-title">تسجيل جديد</div>

      <!-- DS-INP: Employee structured name (3 fields, emp type only) -->
      <div id="empNameFields">
        <div class="field" id="wrapper-rFirstName">
          <label for="rFirstName">الاسم الأول</label>
          <div class="l-input-wrap">
            <input id="rFirstName" type="text" autocomplete="given-name" placeholder="الاسم الأول"
                   aria-required="true"
                   aria-invalid="false"
                   aria-describedby="r-first-name-error">
          </div>
          <span id="r-first-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
        </div>
        <div class="field" id="wrapper-rMiddleName">
          <label for="rMiddleName">الاسم الأوسط <span class="optional-tag">(اختياري)</span></label>
          <div class="l-input-wrap">
            <input id="rMiddleName" type="text" autocomplete="additional-name" placeholder="الاسم الأوسط (اختياري)"
                   aria-required="false"
                   aria-invalid="false">
          </div>
        </div>
        <div class="field" id="wrapper-rLastName">
          <label for="rLastName">اسم العائلة</label>
          <div class="l-input-wrap">
            <input id="rLastName" type="text" autocomplete="family-name" placeholder="اسم العائلة"
                   aria-required="true"
                   aria-invalid="false"
                   aria-describedby="r-last-name-error">
          </div>
          <span id="r-last-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
        </div>
      </div>

      <!-- DS-INP: Org name field (co/edu type only) -->
      <div class="field" id="wrapper-rName" hidden>
        <label id="nameLabel" for="rName">الاسم الكامل</label>
        <div class="l-input-wrap">
          <input id="rName" type="text" autocomplete="organization" placeholder="اكتب الاسم..."
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-name-error">
        </div>
        <span id="r-name-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: email field (INP-09: dir=ltr for email) -->
      <div class="field" id="wrapper-rEmail">
        <label for="rEmail">البريد الإلكتروني</label>
        <div class="l-input-wrap">
          <input id="rEmail" type="email" autocomplete="email" placeholder="example@email.com"
                 dir="ltr"
                 spellcheck="false"
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-email-error">
        </div>
        <span id="r-email-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <!-- DS-INP: password field with show/hide toggle (INP-11) -->
      <div class="field" id="wrapper-rPass">
        <label for="rPass">كلمة المرور</label>
        <div class="l-input-wrap pass-wrap">
          <input id="rPass" type="password" autocomplete="new-password"
                 placeholder="6 أحرف على الأقل"
                 aria-required="true"
                 aria-invalid="false"
                 aria-describedby="r-pass-error">
          <button type="button" id="rPassEye" class="pass-eye"
                  aria-label="إظهار كلمة المرور"
                  aria-pressed="false">
            <svg id="rEyeShow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg id="rEyeHide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
          </button>
        </div>
        <span id="r-pass-error" class="field-error" role="alert" aria-live="polite" hidden></span>
      </div>

      <div id="passStrengthBar">
        <div id="passStrengthFill"></div>
      </div>
      <div id="passStrengthLabel"></div>
      <button class="cta" type="button" id="regBtn" aria-busy="false" onclick="doRegister()">إنشاء حساب</button>
      <div class="switch-link hidden" id="regBackPanel">عندك حساب؟ <span onclick="showLogin()">دخول</span></div>
    </div>
  </div>

</main>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/tw_shared.js"></script>
<script src="/static/index.auth.js?v=auth-gw-v8"></script>
<script src="/static/index.ui.js?v=auth-gw-v8"></script>
</body>
</html>
