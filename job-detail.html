<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<title>تواصلنا - تفاصيل الوظيفة</title>
<link rel="stylesheet" href="/static/app-header.css">
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/job/job-detail.css">
</head>
<body>

<a href="#jdMain" class="skip-link" data-tw-t="common.skip_to_content"></a>

<!-- Unified app header with back; fallback = home when there is no in-site history (HEADER-NAV.md HNAV-03) -->
<header data-tw-header data-back="home"></header>

<!-- Main shell -->
<div class="jd-shell" id="jdMain" role="main">

  <!-- Skeleton (shown while loading) -->
  <div id="jdSkeleton">
    <div class="jd-skl jd-skl-hero"></div>
    <div class="jd-skl jd-skl-row"></div>
    <div class="jd-skl jd-skl-block"></div>
    <div class="jd-skl jd-skl-card"></div>
  </div>

  <!-- Error / empty state -->
  <div id="jdStateBox" class="jd-state hidden" role="alert"></div>

  <!-- Content (shown after load) -->
  <div id="jdContent" class="hidden">

    <!-- Job header -->
    <div class="jd-header" role="article">
      <div class="jd-hd-top">
        <div class="jd-logo-wrap">
          <div class="jd-logo" id="jdLogo" aria-hidden="true"></div>
          <span class="jd-logo-badge" id="jdLogoBadge" hidden data-tw-t-label="job.verified_co"><i data-tw-icon="star" data-tw-size="xs" data-tw-filled></i></span>
        </div>
        <div class="jd-info">
          <h1 class="jd-title" id="jdTitle"></h1>
          <!-- Company name: a real link to /u/{tw_id} when known, plain text otherwise -->
          <a class="jd-co-name" id="jdCoName"></a>
          <div class="jd-meta" id="jdMeta" data-tw-t-label="job.meta_label"></div>
        </div>
      </div>
      <div class="jd-tags" id="jdTags" data-tw-t-label="job.skills_required"></div>
    </div>

    <!-- Content grid: main, then sidebar (below the main column on mobile) -->
    <div class="jd-grid">

      <!-- Main column -->
      <div class="jd-main">

        <!-- Match section (revealed after skill load) -->
        <div id="jdMatchSection" class="jd-match hidden" role="region" data-tw-t-label="job.match_label">
          <div class="jd-match-ring" id="jdMatchRing" aria-hidden="true">
            <span class="jd-match-pct">–</span>
            <span class="jd-match-lbl" id="jdMatchLbl"></span>
          </div>
          <div class="jd-match-body" id="jdMatchBody"></div>
        </div>

        <!-- Description -->
        <div class="jd-section hidden" id="jdDescSection">
          <div class="jd-sec-title"><i data-tw-icon="file-text" data-tw-size="md"></i><span data-tw-t="job.desc"></span></div>
          <div class="jd-body-text" id="jdDesc"></div>
        </div>

        <!-- Skills required -->
        <div class="jd-section hidden" id="jdSkillsSection">
          <div class="jd-sec-title"><i data-tw-icon="wrench" data-tw-size="md"></i><span data-tw-t="job.skills_required"></span></div>
          <div class="jd-skill-chips" id="jdSkillChips" data-tw-t-label="job.skills"></div>
        </div>

        <!-- Accepted professions -->
        <div class="jd-section hidden" id="jdAccProfSection">
          <div class="jd-sec-title"><i data-tw-icon="users" data-tw-size="md"></i><span data-tw-t="job.accepted_prof"></span></div>
          <div class="jd-skill-chips" id="jdAccProfChips" data-tw-t-label="job.accepted_prof"></div>
        </div>

      </div><!-- end .jd-main -->

      <!-- Sidebar (desktop: side column · mobile: under the main content) -->
      <aside class="jd-sidebar" data-tw-t-label="job.side_label">

        <!-- Apply card (mobile: the sticky bar carries these actions) -->
        <div class="jd-apply-card">
          <div class="jd-apply-title" id="jdApplyCardTitle" data-tw-t="job.interested"></div>
          <div class="jd-apply-actions">
            <!-- «تقديم» = twAction('apply_job') (Actions Registry) — rendered by the page script -->
            <div class="jd-apply-slot" data-jd-apply-slot="card"></div>
            <button type="button" class="jd-save-btn jd-save-trigger" id="jdSaveBtn" data-tw-t-label="job.save_label"><i data-tw-icon="bookmark" data-tw-size="md"></i><span data-tw-t="job.save"></span></button>
          </div>
          <div class="jd-act-slot" data-jd-action-slot="share"></div>
          <div class="jd-act-slot" data-jd-action-slot="report"></div>
        </div>

        <!-- Job info -->
        <div class="jd-side-card">
          <div class="jd-sc-title" data-tw-t="job.info"></div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="building-2" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.company"></div><div class="jd-sc-val" id="jdSiCo"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="map-pin" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.location"></div><div class="jd-sc-val" id="jdSiLoc"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="clock" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.work_type"></div><div class="jd-sc-val" id="jdSiType"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="laptop" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.work_mode"></div><div class="jd-sc-val" id="jdSiMode"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="bar-chart-2" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.exp"></div><div class="jd-sc-val" id="jdSiExp"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="circle-dollar-sign" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.salary"></div><div class="jd-sc-val" id="jdSiSal"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="eye" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.views"></div><div class="jd-sc-val" id="jdSiViews"></div></div>
          </div>
          <div class="jd-sc-row">
            <div class="jd-sc-ico"><i data-tw-icon="calendar" data-tw-size="md"></i></div>
            <div><div class="jd-sc-lbl" data-tw-t="job.date"></div><div class="jd-sc-val" id="jdSiDate"></div></div>
          </div>
        </div>

        <!-- Company card -->
        <div class="jd-side-card">
          <div class="jd-sc-title" data-tw-t="job.about_co"></div>
          <div class="jd-co-card">
            <div class="jd-co-av" id="jdCoCardAv" aria-hidden="true"></div>
            <div>
              <a class="jd-co-cname" id="jdCoCardName"></a>
              <div class="jd-co-verified" id="jdCoCardVerif"></div>
            </div>
          </div>
        </div>

        <!-- Similar jobs (one list — the sidebar shows on every width) -->
        <div class="jd-side-card">
          <div class="jd-sc-title" data-tw-t="job.similar"></div>
          <div id="jdSimilarList"></div>
        </div>

      </aside><!-- end .jd-sidebar -->

    </div><!-- end .jd-grid -->

  </div><!-- end #jdContent -->

</div><!-- end .jd-shell -->

<!-- Sticky apply bar — mobile only -->
<div class="jd-sticky-bar" id="jdStickyBar" role="toolbar" data-tw-t-label="job.sticky_label">
  <div class="jd-sticky-inner">
    <div class="jd-sticky-slot" data-jd-apply-slot="sticky"></div>
    <button type="button" class="jd-sticky-save jd-save-trigger" id="jdStickySaveBtn" data-tw-t-label="job.save_label"><i data-tw-icon="bookmark" data-tw-size="lg"></i></button>
    <div class="jd-sticky-icon-slot" data-jd-action-slot="share-icon"></div>
  </div>
</div>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-options-data.js"></script>
<script src="/static/shared/tw-skills.js"></script>
<script src="/static/job/job-detail.js"></script>
</body>
</html>
