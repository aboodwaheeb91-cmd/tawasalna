<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head:admin-->
<!-- Admin — one user's account (task 5.3b · docs/rules/admin-shell.md · SYSTEMS_INDEX §25a).
     Route: /admin-view?id=N (server.py → admin_view) — opened from the panel's user list (not a menu item).
     Data: GET /admin/profile/{id} · every change through TwAdminShell.run (confirm first).
     Logic: static/admin-view/admin-view.js · header / menu / session gate: static/shared/admin-shell.js. -->
<link rel="stylesheet" href="/static/shared/admin-shell.css?v={{v:admin-shell.css}}">
<title></title>
<style>
.av-btns { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.av-btns .tw-act { flex: 1 1 140px; justify-content: center; gap: var(--space-2); }
.av-btns .tw-act.is-current { border-color: var(--color-brand-primary); color: var(--color-brand-primary); }
.av-form { display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--size-font-xs);
  color: var(--color-text-secondary); font-weight: 700; }
.av-form .tw-input { width: 100%; }
.av-form textarea.tw-input { min-height: 96px; resize: vertical; }
.av-desc { font-size: var(--size-font-xs); color: var(--color-text-muted); line-height: 1.8; margin-top: var(--space-2); overflow-wrap: anywhere; }
</style>
</head>
<body class="tw-adm-body-page">
<header data-tw-header="admin" hidden></header>

<main class="tw-adm-main" id="main-content">
  <div id="avRoot" aria-live="polite"><p class="tw-adm-msg" data-tw-t="common.loading"></p></div>
</main>

<!--tw:strings-->
<!--tw:shell-scripts:admin-->
<script src="/static/shared/admin-session.js"></script>
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/admin-sections.js?v={{v:admin-sections.js}}"></script>
<script src="/static/shared/admin-shell.js?v={{v:admin-shell.js}}"></script>
<script src="/static/admin-view/admin-view.js"></script>
</body>
</html>
