<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--tw:shell-head-->
<link rel="stylesheet" href="/static/shared/tw-select.css?v={{v:tw-select.css}}">
<link rel="stylesheet" href="/static/app-header.css">
<title></title>
<meta name="tw-page" content="auth">
<style>
/* Appointment room — page styles (DS-COLOR --color-* only — PR 4.12 · DS-SIZE tokens · local --ap-* = page aliases of tokens) */
:root{
  --ap-border:var(--color-border-subtle);
  --ap-text:var(--color-text-body);--ap-text-sub:var(--color-text-meta);
  --ap-danger:var(--color-status-danger-strong);--ap-warn:var(--color-status-warning-strong);
  --r:var(--radius-xl);--font:'Cairo',sans-serif
}
body{background:var(--color-surface-page);color:var(--ap-text);font-family:var(--font);min-height:100vh;
  display:flex;flex-direction:column}
/* Header = unified app header with back (app-header.css · HEADER-NAV.md). Room title row below it: */
.room-head{border-bottom:1px solid var(--ap-border);padding:var(--space-6) var(--space-8);display:flex;align-items:center;gap:var(--space-5)}
.room-head-info{flex:1;min-width:0}
.room-head-title{font-size:var(--size-font-xl);font-weight:700;color:var(--ap-text)}
.room-head-sub{font-size:var(--size-font-xs);color:var(--ap-text-sub)}
.badge{display:inline-flex;align-items:center;padding:var(--space-1) var(--space-5);border-radius:var(--radius-3xl);
  font-size:11px;font-weight:700}
.badge-pending{background:rgba(var(--color-status-warning-strong-rgb),.12);color:var(--ap-warn)}
.badge-confirmed{background:rgba(var(--color-brand-primary-rgb),.12);color:var(--color-brand-primary)}
.badge-cancelled{background:rgba(var(--color-status-danger-strong-rgb),.12);color:var(--ap-danger)}
.badge-reschedule{background:rgba(var(--color-brand-accent-rgb),.12);color:var(--color-brand-accent)}
.badge-expired{background:rgba(var(--color-status-danger-strong-rgb),.1);color:var(--color-status-danger)}
.badge-completed{background:rgba(var(--color-brand-secondary-rgb),.12);color:var(--color-brand-secondary)}
.badge-closed{background:rgba(var(--color-ink-rgb),.06);color:var(--ap-text-sub)}
.badge-draft{background:rgba(var(--color-ink-rgb),.06);color:var(--ap-text-sub)}
.badge-missed{background:rgba(var(--color-status-danger-strong-rgb),.1);color:var(--color-status-danger)}
/* Main layout: scrollable area above fixed bottom */
.main{flex:1;overflow-y:auto;padding:var(--space-6) var(--space-8);padding-bottom:var(--space-4)}
/* Info card */
.info-card{background:var(--color-surface-card);border:1px solid var(--ap-border);border-radius:var(--r);
  padding:var(--space-8);margin-bottom:var(--space-6)}
.ic-row{display:flex;align-items:center;gap:var(--space-5);margin-bottom:var(--space-5)}
.ic-names{flex:1;min-width:0}
.ic-main{font-size:var(--size-font-xl);font-weight:700;color:var(--ap-text)}
.ic-sub{font-size:var(--size-font-xs);color:var(--ap-text-sub);margin-top:var(--space-1)}
.ic-detail{display:flex;flex-wrap:wrap;gap:var(--space-4);margin-top:var(--space-5)}
.ic-meta{display:flex;align-items:center;gap:5px;font-size:var(--size-font-xs);color:var(--ap-text-sub)}
.ic-meta .tw-ico{flex-shrink:0}
/* countdown */
.countdown{font-size:var(--size-font-xs);color:var(--ap-warn);font-weight:700;margin-top:var(--space-3)}
/* Online URL */
.url-card{background:rgba(var(--color-brand-secondary-rgb),.06);border:1px solid rgba(var(--color-brand-secondary-rgb),.2);
  border-radius:var(--radius-md);padding:var(--space-5) var(--space-7);margin-bottom:var(--space-6);display:flex;align-items:center;gap:var(--space-4)}
.url-lbl{font-size:var(--size-font-xs);color:var(--ap-text-sub);margin-bottom:var(--space-1)}
.url-link{font-size:var(--size-font-md);color:var(--color-brand-secondary);word-break:break-all}
/* Onsite location */
.loc-card{background:rgba(var(--color-status-warning-strong-rgb),.06);border:1px solid rgba(var(--color-status-warning-strong-rgb),.2);border-radius:var(--radius-md);
  padding:var(--space-5) var(--space-7);margin-bottom:var(--space-6);font-size:var(--size-font-md)}
.loc-lbl{font-size:11px;color:var(--ap-text-sub);margin-bottom:3px}
.loc-txt{color:var(--ap-text)}
/* Action buttons */
.actions{display:flex;flex-wrap:wrap;gap:var(--space-4);margin-bottom:var(--space-6)}
.btn-act{flex:1;min-width:140px;padding:var(--space-5) var(--space-7);border-radius:var(--radius-md);border:none;
  font-size:var(--size-font-md);font-weight:700;font-family:var(--font);cursor:pointer;transition:.2s;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-3)}
.btn-accept{background:rgba(var(--color-brand-primary-rgb),.15);border:1px solid rgba(var(--color-brand-primary-rgb),.3);color:var(--color-brand-primary)}
.btn-accept:hover{background:rgba(var(--color-brand-primary-rgb),.25)}
.btn-reschedule{background:rgba(var(--color-brand-accent-rgb),.12);border:1px solid rgba(var(--color-brand-accent-rgb),.25);color:var(--color-brand-accent)}
.btn-cancel-act{background:rgba(var(--color-status-danger-strong-rgb),.1);border:1px solid rgba(var(--color-status-danger-strong-rgb),.2);color:var(--ap-danger)}
.btn-complete{background:rgba(var(--color-brand-secondary-rgb),.12);border:1px solid rgba(var(--color-brand-secondary-rgb),.25);color:var(--color-brand-secondary)}
.btn-close-room{background:rgba(var(--color-ink-rgb),.06);border:1px solid var(--ap-border);color:var(--ap-text-sub)}
.btn-propose{background:rgba(var(--color-brand-primary-rgb),.12);border:1px solid rgba(var(--color-brand-primary-rgb),.25);color:var(--color-brand-primary)}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--ap-border);margin-bottom:var(--space-6)}
.tab{padding:var(--space-5) var(--space-9);font-size:var(--size-font-md);font-weight:600;color:var(--ap-text-sub);cursor:pointer;
  border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--color-brand-primary);border-bottom-color:var(--color-brand-primary)}
.tab-panel{display:none}
.tab-panel.active{display:block}
/* Events timeline */
.evt-item{display:flex;gap:var(--space-5);margin-bottom:var(--space-6);align-items:flex-start}
.evt-dot{width:10px;height:10px;border-radius:var(--radius-circle);background:var(--color-brand-primary);margin-top:var(--space-2);flex-shrink:0}
.evt-dot.system{background:var(--ap-text-sub)}
.evt-dot.cancel{background:var(--ap-danger)}
.evt-body{flex:1}
.evt-type{font-size:var(--size-font-md);color:var(--ap-text);font-weight:600}
.evt-meta{font-size:11px;color:var(--ap-text-sub);margin-top:var(--space-1)}
.evt-reason{font-size:var(--size-font-xs);color:var(--ap-warn);margin-top:3px}
.panel-note{color:var(--ap-text-sub);font-size:var(--size-font-md);padding:var(--space-5)}
.panel-empty{text-align:center;padding:var(--space-10);color:var(--ap-text-sub);font-size:var(--size-font-md)}
.panel-error{color:var(--ap-danger);padding:var(--space-5);font-size:var(--size-font-md)}
/* Messages thread */
.msgs-list{display:flex;flex-direction:column;gap:var(--space-4);padding-bottom:var(--space-2)}
.msg-item{max-width:80%;padding:9px var(--space-6);border-radius:var(--radius-lg);font-size:var(--size-font-lg);line-height:1.5}
.msg-own{align-self:flex-start;background:rgba(var(--color-brand-primary-rgb),.1);border:1px solid rgba(var(--color-brand-primary-rgb),.15);color:var(--ap-text)}
.msg-other{align-self:flex-end;background:var(--color-surface-card);border:1px solid var(--ap-border);color:var(--ap-text)}
.msg-name{font-size:11px;font-weight:700;color:var(--ap-text-sub);margin-bottom:var(--space-2)}
.msg-time{font-size:var(--size-font-3xs);color:var(--ap-text-sub);margin-top:3px;text-align:left}
.msgs-empty{text-align:center;padding:30px;color:var(--ap-text-sub);font-size:var(--size-font-md)}
.msgs-older{align-self:center;background:none;border:1px solid var(--ap-border);border-radius:var(--radius-lg);color:var(--ap-text-sub);font-family:inherit;font-size:var(--size-font-xs);padding:var(--space-2) var(--space-5);cursor:pointer}
.msgs-older:disabled{opacity:.6;cursor:default}
/* Fixed bottom input */
.msg-input-bar{position:sticky;bottom:0;background:var(--color-surface-glass);border-top:1px solid var(--ap-border);
  padding:var(--space-5) var(--space-8);display:flex;gap:var(--space-4);align-items:flex-end}
.msg-input-bar.hidden{display:none}
.msg-ta{flex:1;padding:9px var(--space-6);border-radius:var(--radius-md);border:1px solid var(--ap-border);
  background:var(--color-surface-raised);color:var(--ap-text);font-family:var(--font);
  font-size:var(--size-font-lg);resize:none;min-height:38px;max-height:100px}
.msg-ta:focus{outline:none;border-color:var(--color-brand-primary)}
.msg-send-btn{padding:9px var(--space-8);border-radius:var(--radius-md);background:transparent;
  border:1.5px solid var(--color-brand-primary);color:var(--color-brand-primary);font-family:var(--font);font-size:var(--size-font-md);
  font-weight:700;cursor:pointer;flex-shrink:0;transition:.2s;height:38px}
.msg-send-btn:hover{background:rgba(var(--color-brand-primary-rgb),.15)}
/* Status note — every status has a visible line saying where the appointment stands (PR 4.12) */
.status-note{display:flex;align-items:flex-start;gap:var(--space-3);background:var(--color-surface-raised);border:1px solid var(--ap-border);
  border-radius:var(--radius-md);padding:var(--space-5) var(--space-7);margin-bottom:var(--space-6);font-size:var(--size-font-md);color:var(--ap-text)}
.status-note .tw-ico{flex-shrink:0;color:var(--ap-text-sub);margin-top:var(--space-1)}
/* closed overlay */
.closed-banner{background:var(--color-surface-raised);border:1px solid var(--ap-border);
  border-radius:var(--radius-md);padding:var(--space-6) var(--space-8);color:var(--ap-text-sub);font-size:var(--size-font-md);
  margin-bottom:var(--space-6);display:flex;align-items:center;justify-content:center;gap:var(--space-3)}
.error-page{text-align:center;padding:80px var(--space-10);color:var(--ap-text-sub)}
.error-icon{display:flex;justify-content:center;margin-bottom:var(--space-6)}
.error-icon .tw-ico{width:40px;height:40px}
.error-title{font-size:var(--size-font-xl);color:var(--ap-text)}
.error-sub{font-size:var(--size-font-md);margin-top:var(--space-3)}
.error-link{display:inline-block;margin-top:var(--space-10);color:var(--color-brand-primary);font-size:var(--size-font-md)}
.error-fail{font-size:var(--size-font-md);color:var(--ap-danger)}
.skeleton{background:linear-gradient(90deg,rgba(var(--color-ink-rgb),.04) 25%,rgba(var(--color-ink-rgb),.07) 50%,rgba(var(--color-ink-rgb),.04) 75%);
  background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--radius-sm);margin-bottom:var(--space-5)}
.sk-info{height:100px}.sk-url{height:60px}.sk-panel{height:200px}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}
</style>
</head>
<body>

<!-- Unified app header with back; fallback = /appointments when there is no in-site history (HNAV-03) -->
<header data-tw-header data-back="/appointments"></header>
<div class="room-head">
  <div class="room-head-info">
    <div class="room-head-title" id="hdrTitle" data-tw-t="appt.room.title"></div>
    <div class="room-head-sub" id="hdrSub"></div>
  </div>
  <span id="hdrBadge" class="badge"></span>
</div>

<div class="main" id="mainContent">
  <div class="skeleton sk-info"></div>
  <div class="skeleton sk-url"></div>
  <div class="skeleton sk-panel"></div>
</div>

<div class="msg-input-bar hidden" id="msgInputBar">
  <textarea class="msg-ta" id="msgTa" rows="1" data-tw-t-placeholder="appt.room.msg_placeholder"></textarea>
  <button class="msg-send-btn" id="msgSendBtn" data-tw-t="appt.room.msg_send"></button>
</div>

<!--tw:shell-scripts-->
<script src="/static/shared/tw-icons.js?v={{v:tw-icons.js}}"></script>
<script src="/static/shared/tw-overlay.js?v={{v:tw-overlay.js}}"></script>
<script src="/static/shared/tw-select.js?v={{v:tw-select.js}}"></script>
<script src="/static/shared/tw-schedule.js?v={{v:tw-schedule.js}}"></script>
<script>
(function(){
  'use strict';
  // Protected page guard (tw_shared.js) — TwAuthSync snapshot only; guest → /login?next=/appointment-room?id=N
  if (!twRequireAuth()) return;

  const params = new URLSearchParams(location.search);
  const APPT_ID = parseInt(params.get('id'));
  if (!APPT_ID) { location.href = '/appointments'; return; }

  // All page text = Strings System keys (twT — SYSTEMS_INDEX §59); static markup via data-tw-*.
  document.title = twT('page.title', { page: twT('appt.room.title') });
  twTApply(document.body);

  let _appt = null;
  let _activeTab = 'events';
  let _msgPollTimer = null;
  let _pollWarned = false;

  // Status → badge class. Labels = twT('appt.status.<status>'); an unknown status still gets
  // a label + note (appt.status.unknown / appt.room.note.unknown) — never a raw code.
  const STATUS_CLASS = {
    draft:'badge-draft', pending_response:'badge-pending',
    reschedule_requested:'badge-reschedule', confirmed:'badge-confirmed',
    cancelled:'badge-cancelled', expired:'badge-expired',
    missed:'badge-missed', completed:'badge-completed', closed:'badge-closed'
  };
  // Event types with a label (appt.event.<type>); anything else → appt.event.unknown
  const EVT_TYPES = ['appointment_created', 'appointment_sent', 'appointment_accepted',
    'appointment_reschedule_requested', 'appointment_rescheduled', 'appointment_confirmed',
    'appointment_cancelled', 'appointment_completed', 'appointment_closed',
    'appointment_expired', 'message_sent'];

  // API calls via twApi (tw_shared.js — API Client Rule): auth headers, JSON, timeout, never
  // throws (network / timeout → ok:false + Arabic message); 401 → TwAuthSync.invalidateSession →
  // the page guard sends the visitor to /login?next=. Error text via twApiMessage (FBK M15).
  function apptApi(sub, opts){
    return twApi('/api/appointments/' + APPT_ID + (sub || ''), opts);
  }

  // Action button: DS-ICON icon + label (no emoji — F37)
  function actBtn(cls, icon, label){
    const b = document.createElement('button');
    b.className = 'btn-act ' + cls;
    b.appendChild(twIconEl(icon, { size: 'sm' }));
    b.appendChild(document.createTextNode(label));
    return b;
  }

  function countdown(iso){
    const diff = new Date(iso) - Date.now();
    if (!(diff > 0)) return twT('appt.room.countdown.over');
    const h = Math.floor(diff/3600000);
    const m = Math.floor((diff%3600000)/60000);
    if (h > 48) return twT('appt.room.countdown.days', { n: Math.floor(h/24) });
    if (h > 0) return twT('appt.room.countdown.hours', { h: h, m: m });
    return twT('appt.room.countdown.minutes', { m: m });
  }

  // DOM refs
  const mainContent = document.getElementById('mainContent');
  const msgInputBar = document.getElementById('msgInputBar');
  const msgTa       = document.getElementById('msgTa');
  const msgSendBtn  = document.getElementById('msgSendBtn');
  const hdrTitle    = document.getElementById('hdrTitle');
  const hdrSub      = document.getElementById('hdrSub');
  const hdrBadge    = document.getElementById('hdrBadge');

  twIcon.hydrate(document.body);   // static <i data-tw-icon> placeholders (DS-ICON)

  function renderRoom(appt){
    _appt = appt;
    const s = appt.computed_status || appt.status;
    const known = Object.prototype.hasOwnProperty.call(STATUS_CLASS, s);
    const isClosed = s === 'closed';
    const IS_CO = appt.viewer_role === 'company';
    const IS_EMP = appt.viewer_role === 'applicant';
    const otherName = IS_CO ? (appt.applicant_name || twT('appt.room.applicant_fallback'))
                            : (appt.company_name || twT('appt.room.company_fallback'));

    // Header
    safeText(hdrTitle, otherName);
    safeText(hdrSub, appt.job_title || twT('appt.room.interview'));
    hdrBadge.className = 'badge ' + (known ? STATUS_CLASS[s] : 'badge-draft');
    safeText(hdrBadge, twT(known ? 'appt.status.' + s : 'appt.status.unknown'));

    mainContent.innerHTML = '';

    // Info card
    const infoCard = document.createElement('div');
    infoCard.className = 'info-card';
    const icRow = document.createElement('div');
    icRow.className = 'ic-row';

    // DS-IMAGE: the other side — applicant (emp) for the company, company (co) otherwise
    const ava = twAvatarEl(IS_CO
      ? { full_name: appt.applicant_name, avatar_url: appt.applicant_avatar, user_type: 'emp' }
      : { full_name: appt.company_name, avatar_url: appt.company_avatar, user_type: 'co' }, 'lg');

    const names = document.createElement('div');
    names.className = 'ic-names';
    const mainName = document.createElement('div');
    mainName.className = 'ic-main';
    safeText(mainName, otherName);
    const subName = document.createElement('div');
    subName.className = 'ic-sub';
    safeText(subName, appt.job_title || twT('appt.general_interview'));
    names.appendChild(mainName);
    names.appendChild(subName);
    icRow.appendChild(ava);
    icRow.appendChild(names);
    infoCard.appendChild(icRow);

    const details = document.createElement('div');
    details.className = 'ic-detail';

    function addMeta(icon, text){
      if (!text) return;
      const d = document.createElement('div');
      d.className = 'ic-meta';
      d.appendChild(twIconEl(icon, { size: 'sm' }));
      const sp = document.createElement('span');
      safeText(sp, text);
      d.appendChild(sp);
      details.appendChild(d);
    }

    // Dates shown in the viewer's local time (twFormatDateTime — SYSTEMS_INDEX §59a)
    addMeta('clock',
            appt.scheduled_at ? twFormatDateTime(appt.scheduled_at) : twT('appt.room.not_scheduled'));
    if (appt.mode === 'online' || appt.mode === 'onsite') addMeta('calendar', twT('appt.mode.' + appt.mode));
    if (appt.representative_name) {
      addMeta('user', twT('appt.room.representative', { name: appt.representative_name }));
    }

    infoCard.appendChild(details);

    // Countdown
    if (s === 'pending_response' && appt.response_deadline_at) {
      const cd = document.createElement('div');
      cd.className = 'countdown';
      safeText(cd, twT('appt.room.deadline_left', { time: countdown(appt.response_deadline_at) }));
      infoCard.appendChild(cd);
    }
    if (s === 'confirmed' && appt.scheduled_at) {
      const cd = document.createElement('div');
      cd.className = 'countdown';
      safeText(cd, twT('appt.room.time_left', { time: countdown(appt.scheduled_at) }));
      infoCard.appendChild(cd);
    }

    mainContent.appendChild(infoCard);

    // Status note — what this status means for this viewer (every status, incl. unknown)
    if (!isClosed) {
      const note = document.createElement('div');
      note.className = 'status-note';
      note.appendChild(twIconEl('info', { size: 'sm' }));
      const nt = document.createElement('span');
      safeText(nt, twT(known ? 'appt.room.note.' + s + '.' + (IS_CO ? 'co' : 'emp') : 'appt.room.note.unknown'));
      note.appendChild(nt);
      mainContent.appendChild(note);
    }

    // Online URL (participants only — already verified server-side)
    if (appt.online_url && appt.mode === 'online' && !isClosed) {
      const urlCard = document.createElement('div');
      urlCard.className = 'url-card';
      urlCard.appendChild(twIconEl('link', { size: 'md' }));
      const info2 = document.createElement('div');
      const lbl2 = document.createElement('div');
      lbl2.className = 'url-lbl';
      safeText(lbl2, twT('appt.room.meeting_link'));
      const _onlineSafe = twSafeLinkUrl(appt.online_url);   // §54 rule 4b — unsafe → plain text
      const urlA = document.createElement(_onlineSafe ? 'a' : 'span');
      urlA.className = 'url-link';
      if (_onlineSafe) {
        urlA.href = _onlineSafe;
        urlA.target = '_blank';
        urlA.rel = 'noopener noreferrer';
      }
      safeText(urlA, appt.online_url);
      info2.appendChild(lbl2);
      info2.appendChild(urlA);
      urlCard.appendChild(info2);
      mainContent.appendChild(urlCard);
    }

    // Location (onsite)
    if (appt.location_text && appt.mode === 'onsite') {
      const locCard = document.createElement('div');
      locCard.className = 'loc-card';
      const ll = document.createElement('div');
      ll.className = 'loc-lbl';
      safeText(ll, twT('appt.room.location'));
      const lt = document.createElement('div');
      lt.className = 'loc-txt';
      safeText(lt, appt.location_text);
      locCard.appendChild(ll);
      locCard.appendChild(lt);
      mainContent.appendChild(locCard);
    }

    // Closed banner
    if (isClosed) {
      const banner = document.createElement('div');
      banner.className = 'closed-banner';
      banner.appendChild(twIconEl('lock', { size: 'sm' }));
      banner.appendChild(document.createTextNode(twT('appt.room.closed_banner')));
      mainContent.appendChild(banner);
    }

    // Action buttons
    if (!isClosed) {
      const actDiv = document.createElement('div');
      actDiv.className = 'actions';

      // Draft → the shared schedule dialog sends it (Schedule Interview rule 1/5 — one dialog)
      if (IS_CO && s === 'draft') {
        const b = actBtn('btn-accept', 'send', twT('appt.room.send_invite'));
        b.addEventListener('click', function(){
          twScheduleInterview({ candidateId: appt.applicant_id, candidateName: appt.applicant_name, draft: appt });
        });
        actDiv.appendChild(b);
      }
      if (IS_EMP && s === 'pending_response') {
        const b1 = actBtn('btn-accept', 'check', twT('appt.room.accept'));
        b1.addEventListener('click', function(){ doAccept(); });
        const b2 = actBtn('btn-reschedule', 'calendar-clock', twT('appt.room.request_reschedule'));
        b2.addEventListener('click', function(){ openReason('request-reschedule'); });
        const b3 = actBtn('btn-cancel-act', 'close', twT('appt.room.decline'));
        b3.addEventListener('click', function(){ openReason('cancel'); });
        actDiv.appendChild(b1);
        actDiv.appendChild(b2);
        actDiv.appendChild(b3);
      }
      // Reschedule request → the shared schedule dialog, reschedule mode (PR 4.12)
      if (IS_CO && s === 'reschedule_requested') {
        const b = actBtn('btn-propose', 'calendar-clock', twT('appt.room.propose'));
        b.addEventListener('click', function(){
          twScheduleInterview({ candidateId: appt.applicant_id, candidateName: appt.applicant_name, reschedule: appt });
        });
        const bc = actBtn('btn-cancel-act', 'close', twT('appt.room.cancel'));
        bc.addEventListener('click', function(){ openReason('cancel'); });
        actDiv.appendChild(b);
        actDiv.appendChild(bc);
      }
      // PR 2B: missed is not final — the company can still complete or close it.
      if (IS_CO && (s === 'confirmed' || s === 'missed')) {
        const b = actBtn('btn-complete', 'circle-check', twT('appt.room.complete'));
        b.addEventListener('click', function(){ doComplete(); });
        actDiv.appendChild(b);
      }
      if (IS_CO && (s === 'completed' || s === 'cancelled' || s === 'missed' || s === 'expired')) {
        const b = actBtn('btn-close-room', 'lock', twT('action.close_room'));
        b.addEventListener('click', function(){ doClose(); });
        actDiv.appendChild(b);
      }
      // Any participant can cancel confirmed/pending
      if (IS_EMP && (s === 'confirmed')) {
        const b = actBtn('btn-cancel-act', 'close', twT('appt.room.cancel'));
        b.addEventListener('click', function(){ openReason('cancel'); });
        actDiv.appendChild(b);
      }

      if (actDiv.childElementCount > 0) mainContent.appendChild(actDiv);
    }

    // Tabs
    const tabsDiv = document.createElement('div');
    tabsDiv.className = 'tabs';
    const tEvents = document.createElement('div');
    tEvents.className = 'tab' + (_activeTab==='events'?' active':'');
    safeText(tEvents, twT('appt.room.tab_events'));
    tEvents.addEventListener('click', function(){
      _activeTab='events';
      tEvents.classList.add('active'); tMsgs.classList.remove('active');
      pEvents.classList.add('active'); pMsgs.classList.remove('active');
    });
    const tMsgs = document.createElement('div');
    tMsgs.className = 'tab' + (_activeTab==='messages'?' active':'');
    safeText(tMsgs, twT('appt.room.tab_messages'));
    tMsgs.addEventListener('click', function(){
      _activeTab='messages';
      tMsgs.classList.add('active'); tEvents.classList.remove('active');
      pMsgs.classList.add('active'); pEvents.classList.remove('active');
      scrollMsgsToBottom();
    });
    tabsDiv.appendChild(tEvents);
    tabsDiv.appendChild(tMsgs);
    mainContent.appendChild(tabsDiv);

    // Events panel
    const pEvents = document.createElement('div');
    pEvents.className = 'tab-panel' + (_activeTab==='events'?' active':'');
    pEvents.id = 'pEvents';
    mainContent.appendChild(pEvents);
    loadEvents(pEvents);

    // Messages panel
    const pMsgs = document.createElement('div');
    pMsgs.className = 'tab-panel' + (_activeTab==='messages'?' active':'');
    pMsgs.id = 'pMsgs';
    mainContent.appendChild(pMsgs);
    loadMessages(pMsgs);

    // Message input bar
    const canMsg = appt.can_message && !isClosed;
    if (canMsg) {
      msgInputBar.classList.remove('hidden');
      startMsgPoll();
    } else {
      msgInputBar.classList.add('hidden');
    }
  }

  function panelLine(container, cls, text){
    container.innerHTML = '';
    const e = document.createElement('div');
    e.className = cls;
    safeText(e, text);
    container.appendChild(e);
  }

  function loadEvents(container){
    panelLine(container, 'panel-note', twT('appt.room.loading'));
    apptApi('/events').then(res => {
      if (!res.ok) { panelLine(container, 'panel-error', twApiMessage(res, twT('appt.room.events_error'))); return; }
      if (!Array.isArray(res.data) || res.data.length === 0) {
        panelLine(container, 'panel-empty', twT('appt.room.events_empty'));
        return;
      }
      container.innerHTML = '';
      res.data.forEach(ev => container.appendChild(buildEvtItem(ev)));
    });
  }

  function buildEvtItem(ev){
    const type = String(ev.event_type || '');
    const dotClass = type.includes('cancel')||type.includes('expired')
      ? 'evt-dot cancel' : ev.actor_id ? 'evt-dot' : 'evt-dot system';
    const item = document.createElement('div');
    item.className = 'evt-item';
    const dot = document.createElement('div');
    dot.className = dotClass;
    const body = document.createElement('div');
    body.className = 'evt-body';
    const typeEl = document.createElement('div');
    typeEl.className = 'evt-type';
    safeText(typeEl, twT(EVT_TYPES.indexOf(type) !== -1 ? 'appt.event.' + type : 'appt.event.unknown'));
    const metaEl = document.createElement('div');
    metaEl.className = 'evt-meta';
    const who = ev.actor_name ? ev.actor_name : twT('appt.room.system');
    safeText(metaEl, who + ' · ' + twFormatDateTime(ev.created_at));
    body.appendChild(typeEl);
    body.appendChild(metaEl);
    if (ev.payload && ev.payload.reason) {
      const rEl = document.createElement('div');
      rEl.className = 'evt-reason';
      safeText(rEl, twT('appt.room.reason', { reason: ev.payload.reason }));
      body.appendChild(rEl);
    }
    const _evtDate = ev.payload && (ev.payload.new_scheduled_at || ev.payload.scheduled_at);
    if (_evtDate) {
      const rEl = document.createElement('div');
      rEl.className = 'evt-reason';
      safeText(rEl, twT('appt.room.event_time', { time: twFormatDateTime(_evtDate) }));
      body.appendChild(rEl);
    }
    item.appendChild(dot);
    item.appendChild(body);
    return item;
  }

  let _msgs = [];
  const MSG_PAGE = 50;   // server returns the newest MSG_PAGE; ?before_id= loads older pages
  function loadMessages(container){
    apptApi('/messages').then(res => {
      if (!res.ok) {
        panelLine(container, 'panel-error', twApiMessage(res, twT('appt.room.msgs_error')));
        _msgs = [];
        return;
      }
      if (!Array.isArray(res.data) || res.data.length === 0) {
        panelLine(container, 'msgs-empty', twT('appt.room.msgs_empty'));
        _msgs = [];
        return;
      }
      container.innerHTML = '';
      _msgs = res.data;
      const list = document.createElement('div');
      list.className = 'msgs-list';
      list.id = 'msgsList';
      res.data.forEach(m => list.appendChild(buildMsgItem(m)));
      if (res.data.length >= MSG_PAGE) list.insertBefore(buildOlderBtn(), list.firstChild);
      container.appendChild(list);
      scrollMsgsToBottom();
    });
  }

  function buildOlderBtn(){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'msgs-older';
    safeText(b, twT('appt.room.msgs_older'));
    b.addEventListener('click', function(){ loadOlderMessages(b); });
    return b;
  }

  function loadOlderMessages(btn){
    if (!_msgs.length) return;
    btn.disabled = true;
    apptApi('/messages?before_id=' + encodeURIComponent(_msgs[0].id)).then(res => {
      const list = document.getElementById('msgsList');
      if (!res.ok) {
        btn.disabled = false;
        showToast(twApiMessage(res, twT('appt.room.msgs_older_error')), 'error');
        return;
      }
      if (!Array.isArray(res.data) || !list) { btn.disabled = false; return; }
      const older = res.data.filter(m => !_msgs.some(old => old.id === m.id));
      _msgs = older.concat(_msgs);
      older.slice().reverse().forEach(m => list.insertBefore(buildMsgItem(m), btn.nextSibling));
      if (res.data.length < MSG_PAGE) btn.remove(); else btn.disabled = false;
    });
  }

  function buildMsgItem(m){
    const item = document.createElement('div');
    item.className = 'msg-item ' + (m.is_own ? 'msg-own' : 'msg-other');
    item.dataset.id = m.id;
    if (!m.is_own) {
      const nameEl = document.createElement('div');
      nameEl.className = 'msg-name';
      safeText(nameEl, m.sender_name || '');
      item.appendChild(nameEl);
    }
    const bodyEl = document.createElement('div');
    safeText(bodyEl, m.body);
    item.appendChild(bodyEl);
    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    safeText(timeEl, twFormatDateTime(m.created_at));
    item.appendChild(timeEl);
    return item;
  }

  function scrollMsgsToBottom(){
    const list = document.getElementById('msgsList');
    if (list) list.scrollIntoView({block:'end'});
    mainContent.scrollTop = mainContent.scrollHeight;
  }

  function ensureMsgsList(){
    let list = document.getElementById('msgsList');
    const pMsgs = document.getElementById('pMsgs');
    if (!list && pMsgs) {
      pMsgs.innerHTML = '';
      list = document.createElement('div');
      list.className = 'msgs-list';
      list.id = 'msgsList';
      pMsgs.appendChild(list);
    }
    return list;
  }

  function pollMessages(){
    if (_activeTab !== 'messages') return;
    apptApi('/messages').then(res => {
      // Background refresh: a failed poll is retried in 5 s — logged once, no toast every 5 s
      // (the visible load / send paths show their own error).
      if (!res.ok) {
        if (!_pollWarned) { _pollWarned = true; console.warn('[appointment-room] message poll failed', res.status); }
        return;
      }
      _pollWarned = false;
      if (!Array.isArray(res.data)) return;
      const newMsgs = res.data.filter(m => !_msgs.some(old => old.id === m.id));
      if (newMsgs.length === 0) return;
      _msgs = _msgs.concat(newMsgs);
      const list = ensureMsgsList();
      if (list) {
        newMsgs.forEach(m => list.appendChild(buildMsgItem(m)));
        scrollMsgsToBottom();
      }
    });
  }

  function startMsgPoll(){
    if (_msgPollTimer) clearInterval(_msgPollTimer);
    _msgPollTimer = setInterval(pollMessages, 5000);
  }

  // Send message
  msgTa.addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
  msgTa.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSendMsg(); }
  });
  msgSendBtn.addEventListener('click', doSendMsg);

  function doSendMsg(){
    const body = msgTa.value.trim();
    if (!body) return;
    msgSendBtn.disabled = true;
    apptApi('/messages', { method: 'POST', body: { body: body } }).then(res => {
      msgSendBtn.disabled = false;
      if (!res.ok) { showToast(twApiMessage(res, twT('appt.room.msg_send_error')), 'error'); return; }
      msgTa.value = '';
      msgTa.style.height = '';
      const list = ensureMsgsList();
      if (list && res.data) {
        list.appendChild(buildMsgItem(res.data));
        _msgs.push(res.data);
        scrollMsgsToBottom();
      }
    });
  }

  // One state change (accept / complete / close / cancel / request-reschedule): success → reload
  // the room, failure → the server's message (or a fixed fallback) as an error toast.
  function doAction(sub, body){
    return apptApi(sub, { method: 'POST', body: body }).then(res => {
      if (res.ok) { location.reload(); return true; }
      showToast(twApiMessage(res, twT('common.error_retry')), 'error');
      return false;
    });
  }

  // Accept
  function doAccept(){
    twConfirm({ title: twT('appt.room.accept_title'), message: twT('appt.room.accept_msg'),
                confirmText: twT('appt.room.accept_confirm') }).then(function(ok){
      if (ok) doAction('/accept');
    });
  }

  // Complete
  function doComplete(){
    twConfirm({ title: twT('appt.room.complete'), message: twT('appt.room.complete_msg'),
                confirmText: twT('appt.room.complete') }).then(function(ok){
      if (ok) doAction('/complete');
    });
  }

  // Close room
  function doClose(){
    twConfirm({ title: twT('action.close_room_title'), message: twT('action.close_room_msg'),
                confirmText: twT('action.close_room'), danger: true }).then(function(ok){
      if (ok) doAction('/close');
    });
  }

  // Reason dialog (cancel / request reschedule) — DS-OVL twModal; failure keeps it open
  function openReason(action){
    const fieldEl = document.createElement('div');
    fieldEl.className = 'tw-field';
    const lbl = document.createElement('label');
    lbl.htmlFor = 'apptReasonInput';
    safeText(lbl, twT('appt.room.reason_label'));
    const input = document.createElement('input');
    input.className = 'tw-input';
    input.id = 'apptReasonInput';
    input.type = 'text';
    input.maxLength = 500;
    input.placeholder = twT('appt.room.reason_placeholder');
    fieldEl.appendChild(lbl);
    fieldEl.appendChild(input);
    twModal({
      title: twT(action === 'cancel' ? 'appt.room.cancel' : 'appt.room.request_reschedule_title'),
      content: fieldEl,
      actions: [
        { text: twT('common.cancel'), variant: 'secondary' },
        { text: twT('appt.room.confirm'), variant: action === 'cancel' ? 'danger' : 'primary',
          onClick: function(){ return doAction('/' + action, { reason: input.value.trim() }); } },
      ],
    });
  }

  // Load room — 403 / 404 / any other failure each get their own message (never a blank page)
  function roomError(icon, title, sub){
    msgInputBar.classList.add('hidden');
    mainContent.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'error-page';
    const ic = document.createElement('div');
    ic.className = 'error-icon';
    ic.appendChild(twIconEl(icon));
    const t = document.createElement('div');
    t.className = 'error-title';
    safeText(t, title);
    const st = document.createElement('div');
    st.className = 'error-sub';
    safeText(st, sub);
    const back = document.createElement('a');
    back.className = 'error-link';
    back.href = '/appointments';
    safeText(back, twT('appt.room.back'));
    box.appendChild(ic); box.appendChild(t); box.appendChild(st); box.appendChild(back);
    mainContent.appendChild(box);
  }

  apptApi('').then(res => {
    if (res.ok && res.data) { renderRoom(res.data); return; }
    if (res.status === 403) roomError('lock', twT('appt.room.denied_title'), twT('appt.room.denied_sub'));
    else if (res.status === 404) roomError('calendar', twT('appt.room.not_found'), twT('appt.room.not_found_sub'));
    else roomError('alert', twT('appt.room.load_error'), twApiMessage(res, twT('common.check_connection')));
  });
})();
</script>
